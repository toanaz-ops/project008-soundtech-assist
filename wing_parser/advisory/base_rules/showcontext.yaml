# Rules that compare the show's paperwork with the scene. Every one of
# them yields nothing unless a show context is loaded with --show,
# because the cue and segment iterators are empty without one.
rules:
  - id: Q1
    title: "Cue names a channel the scene does not have"
    severity: warning
    source: >
      docs/knowledge-base/04-templates-and-matrices/Master-Run-Of-Show-ROS.md
      section 1.2, Audio Cue column: "State the channel or DCA number,
      never 'open her mic' -- the console has numbers, use them."
    rationale: >
      The ROS standard requires the audio cue to name a console number,
      which makes the number checkable. A cue calling a channel the scene
      does not contain is either a stale cue sheet or a scene loaded from
      the wrong show; both are found in seconds before doors and in the
      worst possible way after them.
    when:
      for_each: cue
      where:
        cue.missing_channel_count: {gt: 0}
    message: >
      Cue {cue.id} in segment {segment.id} names channel(s)
      {cue.missing_channels_text}, which the scene does not contain.

  - id: Q2
    title: "Cue names a channel that carries no name"
    severity: info
    source: >
      docs/knowledge-base/04-templates-and-matrices/Master-Run-Of-Show-ROS.md
      section 1.2, Audio Cue column; Core-Skills-Overview.md section 1.1
      on department cue sheets carrying only that department's cues.
    rationale: >
      The channel exists, so the cue is not wrong -- but an unnamed
      channel is one nobody else at the desk can identify under pressure,
      and a cue sheet that calls it is relying on one person's memory.
      Info, not warning: this is a labelling job, not a fault.
    when:
      for_each: cue
      where:
        cue.unnamed_channel_count: {gt: 0}
    message: >
      Cue {cue.id} in segment {segment.id} names channel(s)
      {cue.unnamed_channels_text}, which exist but carry no name.

  - id: Q3
    title: "Cue names a DCA number the console does not have"
    severity: warning
    source: >
      docs/knowledge-base/04-templates-and-matrices/Master-Run-Of-Show-ROS.md
      section 1.2, Audio Cue column, worked example "SQ 8 GO -- CH3 open,
      DCA2 up".
    rationale: >
      Same failure as Q1 on the other half of the cue's vocabulary. A DCA
      move is the fastest lever on the desk during a show; calling a
      number the console does not have means the operator reaches for a
      fader that cannot exist. This only checks the DCA number against
      the console's fixed 1-16 range (missing_dca_count in
      wing_parser/showcontext/view.py) -- every WING scene carries all 16
      DCA slots, so this never catches a DCA that exists but has no
      members assigned to it. That gap has no rule yet; the index a
      future one would use is already built and tested, Dca.members in
      wing_parser/query/groups.py.
    when:
      for_each: cue
      where:
        cue.missing_dca_count: {gt: 0}
    message: >
      Cue {cue.id} in segment {segment.id} names DCA(s)
      {cue.missing_dcas_text}, which the console does not have.

  - id: Q4
    title: "Segment expects a source with no channel for it"
    severity: warning
    source: >
      docs/knowledge-base/02-event-ops-framework/Core-Skills-Overview.md
      section 1.1, on the department cue sheet carrying that department's
      cues; docs/knowledge-base/04-templates-and-matrices/Master-Run-Of-Show-ROS.md
      section 1.3 step 3, the department pass.
    rationale: >
      The paperwork says this part of the show has a source; the scene
      has no channel confidently classified as it. Either an input is
      unpatched or the scene predates the latest ROS revision. Only
      channels classified at or above the confident band count -- a weak
      name guess must not satisfy an expectation, or the rule quietly
      stops catching the thing it exists for. Same threshold
      Bus.receives_ambient uses. Reported once per expected kind rather
      than once per segment: the scene is static, so a kind with no
      channel is missing for every segment naming it, and per-segment
      reporting turned one fact into fifteen identical warnings on a
      fifteen-segment sheet. ToanAZ's decision, 2026-08-17, spec section
      6.1. The message names the segments so the aggregation loses
      nothing.
    when:
      for_each: expects
      where:
        expectation.is_unmet: true
    message: >
      Segments {expectation.segments_text} expect {expectation.kind}, and no
      confidently-classified channel of that kind exists in the scene.

  - id: Q5
    title: "Segment expects a source whose channels are all parked"
    severity: info
    source: >
      docs/knowledge-base/02-event-ops-framework/Core-Skills-Overview.md
      section 1.1; the in_use definition probed for N1 in the 2026-08-16
      rule-set-growth spec section 4.
    rationale: >
      The channel is there but is unpatched, muted, unrouted, or has its
      fader below the -90 dB floor. On a scene built ahead of doors that
      is normal, which is why this is info and not warning; it is a
      checklist line, not an alarm. Reuses Channel.in_use rather than
      defining a second liveness test, so it cannot drift from N1's.
      Reported once per expected kind rather than once per segment: the
      scene is static, so a kind that is parked is parked for every
      segment naming it, and his scenes are templates with far more
      parked channels than live ones, so per-segment reporting would fire
      on nearly every segment. ToanAZ's decision, 2026-08-17, spec
      section 6.1. The message names the segments so the aggregation
      loses nothing.
    when:
      for_each: expects
      where:
        expectation.is_dark: true
    message: >
      Segments {expectation.segments_text} expect {expectation.kind};
      channels of that kind exist but none is in use.

  - id: Q6
    title: "Cue repeats a channel state an earlier cue already set"
    severity: info
    source: >
      docs/knowledge-base/04-templates-and-matrices/Master-Run-Of-Show-ROS.md
      section 2.3 on point numbering, and section 1.3 step 6, rehearsal
      markup reconciled the same evening.
    rationale: >
      Walking the cues in file order gives every channel an open/closed
      book; opening one already open is a cue restating a state an
      earlier cue already set, not a contradiction -- a caller repeating
      "mics open" at the top of a segment is correct practice, the way a
      show is actually run, not a fault in the paperwork. ToanAZ
      confirmed this 2026-08-17, spec section 6.1, which is why this is
      info: worth seeing when reading a sheet, never an alarm. Only open
      and close move the book -- a level move on a closed channel is not
      redundant, and what a recall does to a given channel is not
      knowable from the cue sheet. Closing a channel the book has never
      seen opened is not caught either: an unseen channel reads as
      neither open nor closed, so that close is silent -- the right
      behaviour, since a sheet may be describing a desk that started with
      things open, not a gap in this check.
    when:
      for_each: cue
      where:
        cue.contradiction_count: {gt: 0}
    message: >
      Cue {cue.id} in segment {segment.id} runs "{cue.action}" on
      channel(s) {cue.contradictions_text}, which earlier cues in this
      show already left in that state -- redundant, not a fault.

  - id: Q7
    title: "Two cues sit closer together than the operation needs"
    severity: warning
    enabled: false
    source: >
      No source for a rig-specific number. ToanAZ deferred the threshold
      on 2026-08-17 rather than accept a placeholder;
      docs/superpowers/specs/2026-08-17-input-pipelines-design.md section
      6 records the decision precisely -- "No source in this repository
      states how long a mic change, a scene recall or a patch change
      takes, and ToanAZ chose (2026-08-17) to wait for a real number
      rather than accept a placeholder" -- and Task 7 of
      docs/superpowers/plans/2026-08-17-input-pipelines-g1.md records the
      same decision at dispatch time. The rule's subject -- how long the
      gap between two cues
      needs to be for the operation between them to complete -- is
      docs/knowledge-base/04-templates-and-matrices/Master-Run-Of-Show-ROS.md
      section 4.3, transition padding by activity; that table gives
      stage transition minimums (mic handoffs, laptop swaps), not WING
      mic-change, scene-recall or patch-change durations, so it cannot
      supply this rule's number.
    rationale: >
      A cue gap shorter than the operation between them takes is a cue
      that will be called late. Shipped disabled because no source in
      this repository states how long a mic change, a scene recall or a
      patch change takes on ToanAZ's rig, and a threshold nobody can cite
      is a threshold that produces noise. To switch it on: get one number
      per action from him, put them in a descriptor file, add the
      comparison to the `where` block below, and set enabled: true. The
      derivation it needs already exists and is tested --
      CueView.seconds_after_previous, which is None unless both cues
      carry a readable time. Trap for whoever does this: the `where`
      below, {lt: 0}, is also satisfied by a negative gap from cues whose
      declared times run backwards -- a typo, or segments whose time:
      fields are not monotonic, since the gap arithmetic has no floor at
      zero -- so enabling the rule with this predicate unchanged will
      fire on the cue sheet's clock running backwards and report it as
      two cues sitting too close together, which is a different problem
      with a different fix; land the real threshold comparison and this
      predicate together, not the predicate alone. This is the N2
      precedent: an honest disable beats a noisy rule.
    when:
      for_each: cue
      where:
        cue.seconds_after_previous: {lt: 0}
    message: >
      Cue {cue.id} in segment {segment.id} is
      {cue.seconds_after_previous} s after the previous timed cue.
