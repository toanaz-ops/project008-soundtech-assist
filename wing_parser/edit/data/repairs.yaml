# How to repair a finding -- declared, never inferred.
#
# A rule with no entry here shows no repair button, and that is a
# complete answer rather than a gap. Most rules state a window or a
# count, so no single value follows from them: PB2-PB5, PC1 and PC6
# give an acceptable frequency *range*; G11 says there are too many
# notches without saying which to remove; G12 says a boost is too high
# without saying what it should be; G7 and G9 want a whole dynamics
# configuration; E6 and S2 have two defensible answers each. Q1-Q7 are
# findings about the cue sheet, not the scene, so no scene edit
# answers them at all.
#
# Every entry needs a rationale. `parse_repairs` refuses one without,
# the same way advisory/loader.py:49 refuses a rule without one.
#
# Placeholders are filled from the finding's own target: "ch.1.send.8"
# supplies {ch: "1", send: "8"}, "ch.16" supplies {ch: "16"}.
repairs:
  - rule: G8
    kind: set
    path: "ae_data.ch.{ch}.send.{send}.mode"
    to: "PRE"
    label: "Set the send to PRE"
    rationale: >
      G8 fires only on a send whose mode is POST reaching a
      monitor-role bus, so PRE is the single value that clears it. No
      other key is touched: the send stays on, at the same level, to
      the same bus. Only the performer's mix stops following the FOH
      fader, which is the whole of what the rule objects to.

  - rule: PB1
    kind: toggle
    path: "ae_data.ch.{ch}.in.set.inv"
    label: "Flip the channel polarity"
    rationale: >
      PB1 fires when a snare-bottom channel's effective polarity is not
      inverted, and query/channel.py:63 defines effective polarity as
      channel inversion XOR source inversion -- inverting twice is not
      inverting. So the rule fires exactly when `inv` equals the
      source's polarity, and flipping `inv` clears it whichever value
      that is. Writing `true` instead would be a no-op on a channel
      whose source is already inverted: the button would report a
      repair that did not happen. This is why `toggle` exists as a
      kind.

  # -- routing errors -------------------------------------------------
  # R1, R2, R3, R3M and R6 all fire on a send being *on* toward a
  # destination the signal must never reach. Turning that one send off
  # is therefore the single value each predicate admits. None of them
  # touches level, mode or any other send.

  - rule: R1
    kind: set
    path: "ae_data.ch.{ch}.main.{main}.on"
    to: false
    label: "Turn the send to this main off"
    rationale: >
      R1 fires on a click channel whose send to a confidently-classified
      FOH main is on. The rider it cites states the routing baldly --
      click is "to monitors only, hard-muted at FOH" -- so off is both
      the single value that clears the predicate and the state the
      source asks for. The channel's monitor and IEM sends are
      untouched, which is where a click belongs.

  - rule: R2
    kind: set
    path: "ae_data.ch.{ch}.main.{main}.on"
    to: false
    label: "Turn the send to this main off"
    rationale: >
      R2 fires on a talkback channel whose send to a confidently-
      classified FOH main is on; the rider bolds "not in FOH mains".
      Off is the only value that clears it. The dedicated TB OUT main
      classifies as talkback rather than main, so this never proposes
      cutting talkback's intended path.

  - rule: R3
    kind: set
    path: "ae_data.ch.{ch}.send.{send}.on"
    to: false
    label: "Turn this send off"
    rationale: >
      R3 fires on a timecode channel with any bus or matrix send on.
      LTC sounds like noise on a loudspeaker, and every send that is on
      is a route toward ears, so off is the single value that clears
      it. The placeholder takes the raw file's own send key, so a
      matrix send target (ch.N.send.MX5) repairs the matrix send and
      not bus 5.

  - rule: R3M
    kind: set
    path: "ae_data.ch.{ch}.main.{main}.on"
    to: false
    label: "Turn the send to this main off"
    rationale: >
      The main-send half of R3, and the same argument: the rule fires on
      the send being on, so off is the only value that clears it.

  - rule: R6
    kind: set
    path: "ae_data.ch.{ch}.send.{send}.on"
    to: false
    label: "Turn this send off"
    rationale: >
      R6 fires when a remote caller's own send into its mix-minus bus
      is on, which is exactly the one channel that bus exists to
      exclude -- the caller hears itself delayed by the platform round
      trip and stops talking. Off is what a mix-minus means, and the
      only value that clears the predicate.

  # -- record feeds ---------------------------------------------------

  - rule: R4
    kind: set
    path: "ae_data.ch.{ch}.send.{send}.mode"
    to: "PRE"
    label: "Set the record send to PRE"
    rationale: >
      R4 fires on a send that is on, in mode POST, into a record-role
      destination. The rider marks the record feed pre-fader and
      contractual: a FOH fader move must not damage the archive. PRE is
      the single value that clears it, and the send stays on at the
      same level. The rule's own rationale notes it can only check the
      fader half, not the pre-EQ half; this repair changes only that
      same half.

  - rule: R5
    kind: set
    path: "ae_data.ch.{ch}.main.{main}.pre"
    to: true
    label: "Set the record main-send to pre-fader"
    rationale: >
      The main-send half of R4. A MainSend carries its own `pre` flag
      and the rule fires on it being false, so true is the only value
      that clears it.

  # -- speech ---------------------------------------------------------

  - rule: S1
    kind: set
    path: "ae_data.ch.{ch}.flt.lc"
    to: true
    label: "Switch the high-pass filter on"
    rationale: >
      S1 fires on a speech-family channel whose low-cut is off, and the
      source it cites calls an HPF on every speech channel
      non-negotiable. The rule objects to the filter being off, not to
      where it is tuned, so switching `lc` on is the whole repair --
      `lcf` is left exactly as the scene stored it. Choosing a corner
      frequency would be a different rule's job, and the window rules
      that do state corners deliberately have no one-click repair.

  - rule: PC8
    kind: set
    path: "ae_data.ch.{ch}.mute"
    to: true
    label: "Mute this Q&A mic"
    rationale: >
      PC8 fires on a channel classified as an audience or Q&A mic that
      is not muted in the saved scene; the source calls those mics
      "killed by default, opened only during Q&A". Muting is the single
      value that clears it. The rule ships as info precisely because a
      scene saved during Q&A legitimately trips it, so this repair is
      offered, never applied on its own.
