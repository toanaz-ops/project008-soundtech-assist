  bolero:
    src: []
    confidence: eng_default
    note: "no source for bolero / cai luong; ballad profile with strings and horns at -8"
    offsets: {speech.vocal: 0, vocal.backing: -5, speech.mc: 0, drums.kick: -14, drums.snare: -16, drums.tom: -14, drums.hihat: -18, drums.overhead: -14, drums.ride: -16, instrument.bass: -9, instrument.guitar.electric: -9, instrument.guitar.acoustic: -4, instrument.keys: -6, instrument.strings: -8, instrument.horns: -8, utility.playback: -6}
