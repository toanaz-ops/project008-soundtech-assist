    offsets: {speech.vocal: 0, vocal.backing: -5, speech.mc: 0, drums.kick: -12, drums.snare: -14, drums.tom: -14, drums.hihat: -18, drums.overhead: -10, drums.ride: -10, instrument.bass: -5, instrument.guitar.electric: -10, instrument.guitar.acoustic: -6, instrument.keys: -8, instrument.strings: -8, instrument.horns: -6, utility.playback: -6}
