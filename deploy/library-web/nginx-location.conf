# Add inside the master.azsoundtech.com server block (PRJ012's nginx).
# No URI after the upstream address => the /library/ prefix is NOT stripped;
# the app serves everything under /library itself.
location /library/ {
    proxy_pass http://127.0.0.1:8731;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 30s;
    client_max_body_size 2m;
}
