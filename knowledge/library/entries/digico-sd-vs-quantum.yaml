summary: 'DiGiCo documents SD and Quantum in one manual, but several features are marked Quantum only: Mustard channels, the Spice Rack, True Solo, nodal processing, five insert positions and Mix Minus. On the SD10 you get two insert points, optional Waves and licensed Theatre and Broadcast modes.'
summary_vi: 'DiGiCo viết SD và Quantum chung một manual, nhưng nhiều tính năng được đánh dấu chỉ Quantum: Mustard channel, Spice Rack, True Solo, nodal processing, năm vị trí insert và Mix Minus. Trên SD10 bạn có hai điểm insert, Waves tuỳ chọn và các chế độ Theatre và Broadcast có licence.'
body: |
  ## Quantum only, per the manual (Issue H, V20+)

  The contents and section headings state these as Quantum only:

  - **Mustard channels** (1.7): a tube/pre-amp model, an EQ, a compressor with four models and a gate/ducker, working alongside the normal SD strip on Quantum engines.
  - **The Spice Rack** (2.6.2): the processing rack on Quantum engines, with the Chilli 6 multiband compressor and the Naga 6 six-band dynamic EQ.
  - **Nodal processing** (aux nodes), **True Solo**, **Mix Minus** (1.4.15: a mono feed at a channel's Direct Output with that channel's own signal removed) and **insert point locations**: five selectable insert positions (pre-fade, mid EQ/dyn, pre-EQ/dyn, pre-processing, post-fade) shared by Inserts A and B and Mustard on Quantum.
  - Q8 chapters (channel macros, Macroders) and Quantum Home are Quantum items too.

  ## What the SD10 has instead

  - **Two insert points per channel:** Insert A above the EQ (pre-processing, after the filters) and Insert B after the second dynamics. Up to 32 mono input channels on SD can switch Insert B to a post-fader insert.
  - **Shared features:** snapshots, macros, control groups, dynamic EQ, DiGiTube, channel dynamics and Set Spill are described for SD and Quantum together, so they are not SD-specific. What the SD range adds over a generic desk is the combination (Recall Scope plus Safes, CG modes, Set Spill, macros with advanced triggers).
  - **Licensed modes:** theatre and broadcast modes are paid upgrades for the SD10 (System > Enable Extensions). What they add is not described in the pages read.
  - **Waves:** the manual describes Enable External Waves as an optional extra giving Waves plug-ins in addition to the console's own FX, using SuperRack SoundGrid (including ProLink from V1742). The product page lists an optional SoundGrid module adding 32 stereo MultiRacks of up to 8 plug-ins each and 128 extra I/O.
  - **Fourier transform.engine integration** appears in the manual as V20xx items; whether it applies to the SD10 was not checked.

  ## How to use it

  1. When reading DiGiCo marketing or videos, check the console model: a Quantum video may show Mustard or Spice Rack, which an SD10 does not have.
  2. Plan plug-in work on an SD10 around the optional Waves/SoundGrid rack, not around Mustard.
  3. Check the manual's version tags (1272+, V1445+, V19xx+) against your SD10 software before relying on a feature.

  ## What is NOT verified

  - The exact feature set of Theatre and Broadcast modes.
  - Whether SD10 hardware can run firmware V20+ at all. The manual covers SD and Quantum jointly; confirm the SD10's last supported version with DiGiCo.
  - Whether the SD10 has DMI slots (the DMI chapters mention consoles with DMI slots).
  - Quantum 338 details: covered by the separate digico-quantum entries.
body_vi: |
  ## Chỉ Quantum, theo manual (Issue H, V20+)

  Mục lục và tiêu đề các mục ghi những thứ này là chỉ Quantum:

  - **Mustard channel** (1.7): model tube/pre-amp, EQ, compressor với bốn model và gate/ducker, chạy song song với strip SD thường trên engine Quantum.
  - **Spice Rack** (2.6.2): rack xử lý trên engine Quantum, gồm Chilli 6 multiband compressor và Naga 6 dynamic EQ sáu band.
  - **Nodal processing** (aux node), **True Solo**, **Mix Minus** (1.4.15: feed mono ở Direct Output của channel với tín hiệu của chính channel đó được bỏ ra) và **vị trí insert**: năm vị trí insert chọn được (pre-fade, mid EQ/dyn, pre-EQ/dyn, pre-processing, post-fade) mà Insert A, B và Mustard cùng chọn trên Quantum.
  - Các chương Q8 (channel macro, Macroder) và Quantum Home cũng là mục của Quantum.

  ## SD10 có gì thay vào

  - **Hai điểm insert mỗi channel:** Insert A phía trên EQ (pre-processing, sau các filter) và Insert B sau dynamics thứ hai. Tới 32 input channel mono trên SD có thể chuyển Insert B thành insert post-fader.
  - **Tính năng có cả trên hai dòng:** snapshot, macro, control group, dynamic EQ, DiGiTube, channel dynamics và Set Spill được mô tả cho cả SD và Quantum, nên không phải riêng của SD. Cái dòng SD có thêm so với một desk tổng quát là cả bộ kết hợp (Recall Scope cộng Safes, các chế độ CG, Set Spill, macro với advanced trigger).
  - **Chế độ có licence:** theatre và broadcast là bản nâng cấp trả phí cho SD10 (System > Enable Extensions). Chúng thêm gì thì các trang đã đọc không mô tả.
  - **Waves:** manual mô tả Enable External Waves là option mua thêm, cho plug-in Waves bên cạnh FX của console, dùng SuperRack SoundGrid (gồm ProLink từ V1742). Trang sản phẩm ghi module SoundGrid tuỳ chọn thêm 32 MultiRack stereo, mỗi cái tới 8 plug-in, và 128 I/O thêm.
  - **Tích hợp Fourier transform.engine** xuất hiện trong manual như mục V20xx; có áp dụng cho SD10 hay không thì chưa kiểm tra.

  ## Cách dùng

  1. Khi xem quảng cáo hoặc video của DiGiCo, kiểm tra model console: video Quantum có thể hiện Mustard hoặc Spice Rack, mà SD10 không có.
  2. Lên kế hoạch plug-in trên SD10 xoay quanh rack Waves/SoundGrid tuỳ chọn, không phải Mustard.
  3. Kiểm tra nhãn version trong manual (1272+, V1445+, V19xx+) với phần mềm SD10 của bạn trước khi dựa vào một tính năng.

  ## Điều CHƯA được xác minh

  - Bộ tính năng chính xác của Theatre và Broadcast mode.
  - Phần cứng SD10 có chạy được firmware V20+ hay không. Manual viết chung cho SD và Quantum; hãy hỏi DiGiCo version cuối cùng SD10 hỗ trợ.
  - SD10 có khe DMI hay không (các chương DMI nhắc tới console có khe DMI).
  - Chi tiết Quantum 338: nằm trong các mục digico-quantum riêng.
