summary: 'Which source pairs most often mask each other and the usual way to separate them, plus the limits a tool should respect when it moves EQ for you: small boosts, larger cuts, moderate Q. The limits are an engineering default, not a published rule.'
summary_vi: 'Những cặp nguồn âm hay che lấp nhau (masking) nhất và cách tách chúng thường dùng, cùng các giới hạn một công cụ phải tuân theo khi tự chỉnh EQ giúp bạn: boost nhỏ, cut lớn hơn, Q vừa phải. Các giới hạn này là mặc định kỹ thuật, không phải quy tắc đã công bố.'
body: |
  ## Pairs that fight

  Masking is one source hiding another because they occupy the same frequency region. The pairs below come from the vendor and magazine articles used for the EQ table.

  - **Kick and bass, about 50 to 300 Hz**: let one of them own 50 to 100 Hz. A magazine article suggests dipping the kick around 160 to 220 Hz and lifting the bass around 220 to 300 Hz so the two read separately.
  - **Vocal and electric guitar, about 1 to 4 kHz**: cut the guitar near 4 kHz to open space for the voice.
  - **Vocal and keys, about 125 Hz to 4 kHz**: a gentle dip around 2 to 4 kHz on the keys, and watch the crowded low mids around 125 to 350 Hz.
  - **Snare and vocal, about 1.5 to 4 kHz**: both want this region. This pair is only indirectly supported by one article.

  ## Limits for an automatic tool

  Research on automatic multitrack EQ (reading only the abstracts that could be opened) reports that systems built to reduce masking did reduce measured and perceived masking in tests, and that a version with one user control improved a raw mix. A separate paper on masking in subgroups is in the same line of work. None of these gave live-sound limits, so the limits here are a conservative engineering default consistent with the small boosts that the Shure article uses (about +3 dB):

  - Boost no more than about 3 dB, cut no more than about 6 dB per move.
  - Q between roughly 0.7 and 4: broad for boosts, narrower for cuts.
  - On a live system prefer cuts over boosts, because a boost raises the gain before feedback.

  ## How to use this

  Apply a pair move only when you can hear the two sources fighting. Solo one, sweep the other, cut where the first is clearest, and check in the full mix. Revisit after the vocal or guitar level changes, because masking depends on level.

  ## Limits

  The AES papers could not be read beyond their abstracts, and no source gives gain or Q for these pairs. Treat the numbers as a ceiling for automatic moves, not a recipe.
body_vi: |
  ## Những cặp hay "đánh nhau"

  Che lấp (Masking) là khi một nguồn âm nuốt mất nguồn khác vì cùng chiếm một vùng tần số. Các cặp dưới đây lấy từ bài của hãng và tạp chí dùng cho bảng EQ.

  - **Kick và bass, khoảng 50 đến 300 Hz**: để một trong hai làm chủ vùng 50 đến 100 Hz. Một bài tạp chí gợi ý dip kick quanh 160 đến 220 Hz và nâng bass quanh 220 đến 300 Hz để hai bên nghe tách bạch.
  - **Vocal và guitar điện, khoảng 1 đến 4 kHz**: cut guitar gần 4 kHz để nhường chỗ cho giọng hát.
  - **Vocal và keys, khoảng 125 Hz đến 4 kHz**: dip nhẹ quanh 2 đến 4 kHz trên keys, và để ý vùng low-mid đông đúc quanh 125 đến 350 Hz.
  - **Snare và vocal, khoảng 1.5 đến 4 kHz**: cả hai đều cần vùng này. Cặp này chỉ được một bài báo ủng hộ gián tiếp.

  ## Giới hạn cho công cụ tự động

  Nghiên cứu về EQ multitrack tự động (chỉ đọc được phần abstract) cho biết các hệ thống được xây để giảm masking đã giảm masking đo được và cảm nhận được trong các bài thử, và một phiên bản chỉ cần một điều khiển cho người dùng đã cải thiện một bản mix thô. Một bài riêng về masking trong subgroup nằm cùng hướng nghiên cứu. Không bài nào đưa ra giới hạn cho live sound, nên các giới hạn ở đây là mặc định kỹ thuật thận trọng, khớp với mức boost nhỏ mà bài của Shure dùng (khoảng +3 dB):

  - Mỗi lần chỉnh, boost không quá khoảng 3 dB, cut không quá khoảng 6 dB.
  - Q trong khoảng 0.7 đến 4: rộng cho boost, hẹp hơn cho cut.
  - Trên hệ thống live ưu tiên cut hơn boost, vì boost làm tăng gain trước ngưỡng hú rít (feedback).

  ## Thao tác thực chiến

  Chỉ áp một cú chỉnh theo cặp khi chính tai bạn nghe được hai nguồn đang đánh nhau. Solo một nguồn, sweep nguồn kia, cut ở chỗ nguồn thứ nhất rõ nhất, rồi kiểm tra trong full mix. Xem lại sau khi level vocal hoặc guitar thay đổi, vì masking phụ thuộc level.

  ## Giới hạn

  Các bài AES chỉ đọc được đến phần abstract, và không nguồn nào cho gain hay Q cho các cặp này. Hãy coi các con số là mức trần cho các cú chỉnh tự động, không phải công thức.
