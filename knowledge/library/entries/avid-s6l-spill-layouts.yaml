summary: With more channels than faders, S6L banks channels in split or single-type modes, lets you Spill the members of an Aux, Group, Matrix or VCA onto the faders with a double-tap of its Attention key, and stores custom User Layouts. VENUE 8.2 adds Input Sends on Fader.
summary_vi: Channel nhiều hơn fader thì S6L bank channel theo chế độ split hoặc theo từng loại, cho bạn Spill các thành viên của Aux, Group, Matrix hay VCA lên fader bằng cách chạm đúp phím Attention, và lưu các User Layout tùy biến. VENUE 8.2 thêm Input Sends on Fader.
body: |
  ## What the manual says (verified, System Guide 7.2 unless noted)

  **Split Banking (default).** Inputs bank to the faders under the Channel Knob Modules; outputs bank to the faders under the Master Live Module. Soft Keys on the left of the MLM pick pre-defined banks. Dual Operator mode (48D, 32D, 24D only) divides the faders into a Left and a Right zone that bank, spill and Bank Safe independently.

  **Fader Bank mode.** The Layouts, VCAs, Inputs or Outputs switches put one channel type on every fader; Horizontal Banking nudges by one channel, one bank of eight, or all faders.

  **Spill.** Double-tap the Attention key of an Aux, Group, Matrix or VCA master, or use the Spill icon in the Universe view, and its members land on the faders. The "Position Safe When Spilling" setting controls whether the spilled master is banked too. Attentioning another output while spilled spills that one. Exit by pressing the Attention key again, choosing a banking mode, pressing Cancel or Spill on the MLM, or Exit Spill on the external screen banner. The manual presents the same Spill mode as the way to bank VCA members and Aux members.

  **Sends on Faders.** Flipping an Aux to the faders shows each input's send level without soloing the Aux. VCAs trim Aux sends in that mode. Version 8.2 adds Input Sends on Fader (ISOF): pick an input on the Master Touch Screen or with an Event and every Aux flips to show that input's send; Mute buttons can assign or unassign Aux sends (setting Assign via Mutes in SOF).

  **User Layouts.** Any channel types in any order, up to 48 strips. Up to 47 additional Layouts per Show can sit on MLM Soft Keys, plus one Layout can be stored in each snapshot (LAYT data type). Created either from the MLM (hold a Soft Key two seconds, then press Attention switches or tap tiles) or in the Universe view with Layout Assign. The manual says a Show saved in VENUE 6.2 or later keeps only its first 24 Layouts if loaded on 6.1 or earlier, which implies the larger layout count arrived in 6.2 (inferred).

  **Bank Safe.** Pins a channel to a fader so it stays under your hand while you bank elsewhere. Attention on Fader temporarily overrides a Bank Safe strip.

  ## How to use it on a show

  - Mix a band: build one Layout with vocals, drums bus, the VCA masters and an effect return; park it on a Soft Key.
  - Monitors: Spill each Aux to see exactly who feeds that mix, then use the Spill-to-Layout Event from the manual (Aux solo loads a Layout).
  - Festival: pre-build a Layout per act and recall it through the snapshot's Layout data type.
  - Use VCAs for stems and Bank Safe the lead vocal fader.

  ## Pitfalls

  - Spill changes what the faders mean; read the strip display before pushing a fader.
  - Layouts are stored in the Show file; loading an older Show on older software truncates the list.
  - Comparison with WING (home console): WING's layer and custom-layer features were not checked here, so no claim is made.

  ## What is NOT verified

  Number of VCAs shown per bank on 8.x, and any 8.0 changes to Layouts. 8.0 What's New lists "New Features for Auxes, Groups, and VCAs" and "CKM Horizontal Mode" but those pages were not read.
body_vi: |
  ## Manual nói gì (đã xác minh, System Guide 7.2 trừ khi ghi khác)

  **Split Banking (mặc định).** Input bank lên các fader dưới Channel Knob Module; output bank lên các fader dưới Master Live Module. Các Soft Key bên trái MLM chọn những bank định sẵn. Dual Operator mode (chỉ 48D, 32D, 24D) chia fader thành vùng Left và Right, mỗi vùng bank, spill và Bank Safe độc lập.

  **Fader Bank mode.** Các nút Layouts, VCAs, Inputs hoặc Outputs đưa một loại channel lên toàn bộ fader; Horizontal Banking nhích từng channel, từng bank tám, hoặc cả dãy fader.

  **Spill.** Chạm đúp phím Attention của master Aux, Group, Matrix hoặc VCA, hay dùng biểu tượng Spill trong Universe view, các thành viên của nó sẽ lên fader. Cài đặt "Position Safe When Spilling" quyết định master bị spill có được bank luôn hay không. Attention một output khác khi đang spill thì spill output đó. Thoát bằng cách bấm lại phím Attention, chọn chế độ banking, bấm Cancel hoặc Spill trên MLM, hay Exit Spill trên banner external screen. Manual coi cùng chế độ Spill này là cách bank thành viên VCA và thành viên Aux.

  **Sends on Faders.** Flip một Aux lên fader để thấy mức send của từng input mà không cần solo Aux. VCA trim send của Aux trong chế độ này. Bản 8.2 thêm Input Sends on Fader (ISOF): chọn một input trên Master Touch Screen hoặc bằng Event, mọi Aux flip để hiện send của input đó; nút Mute có thể gán hay bỏ gán send Aux (cài đặt Assign via Mutes in SOF).

  **User Layout.** Bất kỳ loại channel nào, thứ tự nào, tối đa 48 strip. Mỗi Show có thể có thêm tới 47 Layout đặt trên Soft Key của MLM, cộng một Layout lưu trong mỗi snapshot (data type LAYT). Tạo từ MLM (giữ một Soft Key hai giây rồi bấm các phím Attention hoặc chạm tile) hoặc trong Universe view bằng Layout Assign. Manual nói Show lưu ở VENUE 6.2 trở lên khi nạp vào bản 6.1 trở xuống chỉ giữ 24 Layout đầu, điều này gợi ý số Layout lớn hơn có từ 6.2 (suy luận).

  **Bank Safe.** Ghim một channel vào một fader để nó luôn dưới tay trong khi bạn bank chỗ khác. Attention on Fader tạm thời đè lên strip đang Bank Safe.

  ## Dùng trên show thế nào

  - Mix một ban nhạc: dựng một Layout gồm vocal, bus trống, các master VCA và một effect return; để nó trên một Soft Key.
  - Monitor: Spill từng Aux để thấy chính xác ai đang vào mix đó, rồi dùng Event Spill-to-Layout trong manual (solo Aux thì Load Layout).
  - Festival: dựng sẵn một Layout cho từng ban và recall qua data type Layout của snapshot.
  - Dùng VCA cho các stem và Bank Safe fader lead vocal.

  ## Bẫy thường gặp

  - Spill đổi ý nghĩa của fader; hãy đọc màn hình strip trước khi đẩy fader.
  - Layout lưu trong Show file; nạp Show cũ vào phần mềm cũ sẽ bị cắt bớt danh sách.
  - So sánh với WING (console nhà): chưa kiểm tính năng layer và custom layer của WING ở đây, nên không khẳng định gì.

  ## Điều CHƯA được xác minh

  Số VCA hiển thị mỗi bank trên 8.x, và các thay đổi Layout trong 8.0. What's New 8.0 có liệt kê "New Features for Auxes, Groups, and VCAs" và "CKM Horizontal Mode" nhưng các trang đó chưa đọc.
