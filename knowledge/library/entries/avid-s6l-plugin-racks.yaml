summary: 'S6L runs AAX DSP plug-ins on HDX cards inside the E6L engine: five racks of 80 slots (400 total since VENUE 7.0), used as channel inserts (4 per channel) or as bus processors. DSP is the limit, not slot count; each HDX card gives 18 DSPs. A WSG-HD card adds Waves SoundGrid.'
summary_vi: 'S6L chạy plug-in AAX DSP trên card HDX trong E6L engine: năm rack mỗi rack 80 slot (tổng 400 từ VENUE 7.0), dùng làm insert của channel (4 insert mỗi channel) hoặc xử lý bus. Giới hạn là DSP chứ không phải số slot; mỗi card HDX cho 18 DSP. Card WSG-HD thêm Waves SoundGrid.'
body: |
  ## What the manual says (verified, System Guide 7.2 unless noted)

  **Racks and slots.** The Plug-Ins page has five racks of 80 slots; from VENUE 7.0 all S6L systems have 400 slots. Any plug-in can go in any slot, racks can be renamed (for example Dynamics, Vocal FX). Each slot has Power (off = consumes no DSP), an In/Out switch, an Input selector (a channel insert or a bus source) and an insert/output selector. A channel has four insert points; a plug-in can be pre- or post-fader. From 7.0 you can start from the Inputs or Outputs page: in Config mode tap "+" in an insert slot to jump to the next free rack slot.

  **DSP budget.** Plug-ins use DSP when they sit in a powered slot. Each HDX-192 card in the E6L provides 18 DSPs, and some plug-ins need more than others; if there is not enough DSP, the plug-in shows a warning icon and is unavailable. An E6L-192 takes up to four cards, the E6L-144 and E6L-112 up to two (System Guide 7.2). Options > Devices shows per-card DSP usage. Turn off unused plug-ins to reclaim DSP.

  **Metering and levels.** Meters are in dBVU with 0 dBVU = +4 dBu analog = -20 dBFS; processing is up to 32-bit internally. Plug-in gain-reduction meters vary by manufacturer. Be careful with side-chain routing between pickoff points that differ in level.

  **Snapshots and plug-ins.** Snapshots can store plug-in settings, in/out state and routing, but not Presets, and side-chain routing is not supported in snapshots. A Recall Safe checkbox can block plug-in recall globally. Tap Tempo: the system tempo (default 120 BPM, range 20 to 300 BPM) can be tapped from a Function switch or footswitch through an Event and drives delay plug-ins that have tempo sync on; each snapshot can store its own tempo.

  **Initialization.** The racks initialize at power-on, restart, after installing a plug-in and after disabling or re-enabling one; while initializing they are offline and do not process audio. Avoid Filing and Transfer during that time.

  **Latency.** Plug-in latency is the plug-in's own delay plus 101 samples of routing (see the Delay Compensation entry).

  **Waves SoundGrid (WSG-HD card).** The WSG-HD Waves SoundGrid Option Card in the E6L lets Waves plug-ins on a SoundGrid server appear in the Plug-Ins screen inside a "Waves SoundGrid Rack" plug-in, up to 8 plug-ins per instance, with up to two SoundGrid servers for automatic fail-over. The guide asks for VENUE 5.7 or later and a USB installer (FAT32) prepared on a Windows computer; licences can live on a USB stick (portable) or on the console (good for multi-operator festivals).

  **Newer versions.** The What's New 8.2 contents list "Assignable Encoder Support for Plugins" and "Tempo-Based Dynamics Options" (listed only; those pages were not read).

  ## How to use it on a show

  1. Before the show, count DSP: open Options > Devices and see what each card holds.
  2. Name the racks by job (Vocal FX, Drum dynamics) and keep returns of bus-fed FX in one rack.
  3. Set ADC to Mix and Inserts if parallel paths carry different plug-ins (see Delay Compensation entry).
  4. Put a tempo-synced delay on one tap-tempo Event so the drummer can set it by hand.
  5. After installing or disabling a plug-in, wait for initialization to finish before the doors open.

  ## Pitfalls

  - A Show that references a plug-in not installed on the rental console loads with the plug-in greyed out.
  - Plug-in presets travel by Filing/Transfer; snapshots do not carry presets.
  - Insert a heavy reverb on a bus only once; a bus return is cheaper than per-channel instances (general advice).

  ## What is NOT verified

  Plug-in-by-plug-in DSP cost and which third-party AAX DSP plug-ins are supported (the manual points to a separate compatibility list). Comparison with WING: not researched here, so none is made.
body_vi: |
  ## Manual nói gì (đã xác minh, System Guide 7.2 trừ khi ghi khác)

  **Rack và slot.** Trang Plug-Ins có năm rack, mỗi rack 80 slot; từ VENUE 7.0 mọi hệ S6L có 400 slot. Plug-in nào cũng đặt được vào slot nào, rack đổi tên được (ví dụ Dynamics, Vocal FX). Mỗi slot có Power (tắt thì không tốn DSP), công tắc In/Out, bộ chọn Input (insert của channel hoặc nguồn bus) và bộ chọn insert/output. Mỗi channel có bốn điểm insert; plug-in có thể pre- hoặc post-fader. Từ 7.0 bạn bắt đầu được từ trang Inputs hoặc Outputs: ở Config mode chạm "+" trong slot insert để nhảy tới slot rack trống kế tiếp.

  **Ngân sách DSP.** Plug-in tốn DSP khi nằm trong slot đang bật Power. Mỗi card HDX-192 trong E6L cho 18 DSP, và plug-in này nặng hơn plug-in kia; không đủ DSP thì plug-in hiện biểu tượng cảnh báo và không dùng được. E6L-192 nhận tới bốn card, E6L-144 và E6L-112 tới hai (System Guide 7.2). Options > Devices cho thấy mức dùng DSP của từng card. Tắt plug-in không dùng để lấy lại DSP.

  **Meter và mức.** Meter tính bằng dBVU với 0 dBVU = +4 dBu analog = -20 dBFS; xử lý bên trong tới 32-bit. Meter gain reduction của plug-in khác nhau theo hãng. Cẩn thận khi side-chain giữa các điểm pickoff có mức khác nhau.

  **Snapshot và plug-in.** Snapshot lưu được setting plug-in, trạng thái in/out và routing, nhưng không lưu Preset, và side-chain routing không được snapshot hỗ trợ. Một checkbox Recall Safe có thể chặn recall plug-in toàn cục. Tap Tempo: tempo hệ thống (mặc định 120 BPM, dải 20 tới 300 BPM) gõ được từ công tắc Function hoặc footswitch qua Event, và điều khiển các plug-in delay đang bật tempo sync; mỗi snapshot lưu được tempo riêng.

  **Khởi tạo.** Rack khởi tạo lại khi bật nguồn, khởi động lại, sau khi cài plug-in và sau khi tắt/bật lại một plug-in; trong lúc khởi tạo rack offline và không xử lý âm thanh. Tránh Filing và Transfer lúc đó.

  **Độ trễ.** Latency của plug-in là delay riêng của nó cộng 101 sample routing (xem mục Delay Compensation).

  **Waves SoundGrid (card WSG-HD).** Card WSG-HD Waves SoundGrid Option trong E6L cho plug-in Waves trên server SoundGrid hiện ở màn hình Plug-Ins bên trong plug-in "Waves SoundGrid Rack", tối đa 8 plug-in mỗi instance, tới hai server SoundGrid để tự động fail-over. Guide yêu cầu VENUE 5.7 trở lên và bộ cài trên USB (FAT32) chuẩn bị từ máy Windows; licence để trên USB (mang đi được) hoặc trên console (hợp cho festival nhiều operator).

  **Phiên bản mới hơn.** Mục lục What's New 8.2 liệt kê "Assignable Encoder Support for Plugins" và "Tempo-Based Dynamics Options" (chỉ thấy tiêu đề; các trang đó chưa đọc).

  ## Dùng trên show thế nào

  1. Trước show, đếm DSP: mở Options > Devices xem từng card đang chứa gì.
  2. Đặt tên rack theo việc (Vocal FX, Drum dynamics) và gom return của FX chạy bằng bus vào một rack.
  3. Đặt ADC ở Mix & Inserts nếu các đường song song mang plug-in khác nhau (xem mục Delay Compensation).
  4. Gắn delay tempo sync vào một Event tap-tempo để tay trống tự chỉnh được.
  5. Sau khi cài hay tắt plug-in, đợi khởi tạo xong rồi mới mở cửa.

  ## Bẫy thường gặp

  - Show tham chiếu plug-in chưa cài trên console thuê sẽ nạp lên với plug-in bị xám.
  - Preset plug-in đi qua Filing/Transfer; snapshot không mang theo preset.
  - Reverb nặng nên cắm một lần trên bus; return bus rẻ hơn instance cho từng channel (lời khuyên chung).

  ## Điều CHƯA được xác minh

  Chi phí DSP từng plug-in và plug-in AAX DSP bên thứ ba nào được hỗ trợ (manual chỉ sang một danh sách tương thích riêng). So sánh với WING: chưa nghiên cứu ở đây nên không so sánh.
