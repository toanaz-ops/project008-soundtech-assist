id: eq-filter-types
title: "EQ filter types: HPF/LPF, shelves, bell, notch and Q"
title_vi: "Các loại bộ lọc EQ: HPF/LPF, shelf, bell, notch và Q"
topic: eq
tags:
  instrument: []
  genre: []
