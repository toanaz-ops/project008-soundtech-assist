summary: An Event wires one or more triggers (a switch, a fader level, a meter, a snapshot recall, MIDI, GPI) to one or more actions (mute, snapshot, GPI out, talkback, Pro Tools transport). It is S6L's macro system. System Guide 7.2 allows 8 triggers and 8 actions per event; VENUE 8.0 raised that to 128, and 8.2 added OSC.
summary_vi: Một Event nối một hoặc nhiều trigger (công tắc, mức fader, meter, recall snapshot, MIDI, GPI) với một hoặc nhiều action (mute, snapshot, GPI out, talkback, transport Pro Tools). Đó là hệ macro của S6L. System Guide 7.2 cho 8 trigger và 8 action mỗi event; VENUE 8.0 nâng lên 128, và 8.2 thêm OSC.
body: |
  ## What the manual says (verified)

  **Structure (System Guide 7.2, Control chapter).** An event is a user-defined cause and effect: triggers fire it, actions are the result. Up to 999 events per Show, each named (31 characters) and individually enabled. Triggers include switch presses, fader above/below a dB level, meter above/below (with Hold and Release times), gate open/closed, footswitch and GPI state, snapshot recall or snapshot modes, time of day, MIDI and talkback. Several triggers combine with one logic operator for the whole event: AND, OR (default) or XOR.

  **"Any" triggers and "Triggered Strip" actions.** "Any Channel" or "Any Strip" triggers fire on whichever channel meets the rule, and a "Triggered Strip" action then acts on that same strip. If an AND event is driven by more than one strip, Triggered Strip actions are not executed.

  **Action settings.** State (on, off, toggle, open, closed), Behavior (Latch holds the state until another event changes it; While Active holds it only while the trigger is true), GPI output Pulse of 0.1 to 1.0 s (default 0.3 s), and Wait of up to 100 s before firing. Continuous controls can be Absolute or Relative and can carry an X-Fade with a shape (Linear, Sine, X^2).

  **Version differences.** System Guide 7.2: 0 to 8 triggers and 0 to 8 actions per event. What's New 8.0: raised to 128 each, and a Smart Duplicate button that copies an event, trigger or action while incrementing parameters. What's New 8.2: a new OSC tab on the Control page with 8 connections (TCP Client, TCP Server or UDP over ECx, OSC v1.0 or v1.1); OSC messages become event triggers and actions; the last connection slot is a predefined I/O Sharing Consoles link.

  **Snapshots and Events.** Events can trigger on a specific snapshot recall or on Preview/Update/Edit modes, and can recall, store to a selected snapshot, or change snapshot mode. In Update or Edit mode, event-driven recall is suspended. In Preview, triggers from the online state still run but triggers caused by offline edits are ignored.

  **Function keys.** Function-switch triggers appear in the VENUE Function Pad iOS app; a Show stores up to 128 Function switch assignments. The factory events make F1 to F9 jump to external-screen pages (Inputs, Outputs, Snapshots and so on).

  **Test, Reset, Disable All.** Test forces an event true regardless of state; Reset returns Active or Test events to Ready, cancels pending Wait timers and While Active actions but does not undo latched actions. Disable All and Reset All are the manual's "panic buttons" if events misbehave.

  ## Examples (from the manual)

  - Any input fader below -60 dB: mute that channel (Triggered Strip, Mute).
  - Any input meter above +3 dB for 2 s: engage Gain Guess on that channel; or for 3 s: lower the fader by 3 dB (Relative).
  - Spare vocal Gate closes: mute that input.
  - Footswitch closed, Talkback, Toggle + Latch, or On + While Active for push-to-talk.
  - Ch 1 fader above -60 dB: GPI Output 1 pulse of 0.3 s, a "fader start" cue for a playback device.
  - Aux solo on: Load Layout so the Sends on Faders view spills into a custom layout.

  ## How to use it on a show

  1. Start from a template event, rename it, and test it with the Test button before the doors open.
  2. Put footswitch Talkback and a Recall Next on your own hands' reach; mark the Function keys with the event name (the key takes the name of the lowest-numbered event that uses it).
  3. Use While Active for hold-to-talk, Latch for toggles.
  4. Keep a Disable All key mapped; it is cheaper than debugging a loop under the show light.

  ## Pitfalls

  - Feedback loops: Event A recalls Next on snapshot 003, Event B recalls Previous on snapshot 004; the console then bounces between them.
  - Enabling "Use X/Y as Event Triggers/Actions" stops the channel X and Y switches from toggling the gate and compressor.
  - Loading an Events Preset replaces every event in the list; use the Import Snapshots and Events route to add a few.

  ## What is NOT verified

  - **GPI port count.** The Events chapter says the surface has 2 GPI inputs and 2 GPI outputs, while the introduction table and the GPI reference page describe a DB25 port with 8 inputs and 8 outputs. The manual disagrees with itself; wire to the GPI reference page and test.
  - **The complete trigger and action catalogue.** It lives in a separate Event Triggers and Actions PDF that was not opened.
  - Behaviour of OSC on a live show (latency, message format) beyond the settings listed.
body_vi: |
  ## Manual nói gì (đã xác minh)

  **Cấu trúc (System Guide 7.2, chương Control).** Event là quan hệ nhân quả do người dùng định nghĩa: trigger kích hoạt, action là kết quả. Tối đa 999 event mỗi Show, mỗi event có tên (31 ký tự) và bật/tắt riêng. Trigger gồm bấm công tắc, fader trên/dưới một mức dB, meter trên/dưới (có thời gian Hold và Release), gate mở/đóng, trạng thái footswitch và GPI, recall snapshot hoặc chế độ snapshot, giờ trong ngày, MIDI và talkback. Nhiều trigger kết hợp bằng một toán tử logic cho cả event: AND, OR (mặc định) hoặc XOR.

  **Trigger "Any" và action "Triggered Strip".** Trigger "Any Channel" hoặc "Any Strip" nổ trên bất kỳ channel nào thỏa luật, rồi action "Triggered Strip" tác động lên đúng strip đó. Nếu event AND bị nhiều strip kích cùng lúc thì action Triggered Strip không chạy.

  **Thiết lập của action.** State (on, off, toggle, open, closed), Behavior (Latch giữ trạng thái cho tới khi event khác đổi; While Active chỉ giữ khi trigger còn đúng), GPI output dạng Pulse từ 0,1 tới 1,0 giây (mặc định 0,3 giây), và Wait tới 100 giây trước khi nổ. Điều khiển liên tục chọn Absolute hoặc Relative và có thể kèm X-Fade với một dạng đường cong (Linear, Sine, X^2).

  **Khác biệt theo phiên bản.** System Guide 7.2: 0 tới 8 trigger và 0 tới 8 action mỗi event. What's New 8.0: nâng lên 128 mỗi loại, và thêm nút Smart Duplicate nhân bản event, trigger hoặc action kèm tăng dần thông số. What's New 8.2: thêm tab OSC trên trang Control với 8 kết nối (TCP Client, TCP Server hoặc UDP over ECx, OSC v1.0 hoặc v1.1); thông điệp OSC thành trigger và action của event; slot kết nối cuối là liên kết I/O Sharing Consoles định sẵn.

  **Snapshot và Event.** Event có thể kích theo recall một snapshot cụ thể hoặc theo chế độ Preview/Update/Edit, và có thể recall, store vào snapshot đã chọn, hoặc đổi chế độ snapshot. Ở chế độ Update hoặc Edit, recall do event bị tạm ngưng. Ở Preview, trigger từ trạng thái online vẫn chạy nhưng trigger do chỉnh offline bị bỏ qua.

  **Phím Function.** Trigger là công tắc Function hiện trong app iOS VENUE Function Pad; một Show lưu tối đa 128 gán phím Function. Các event gốc làm F1 tới F9 nhảy sang các trang của external screen (Inputs, Outputs, Snapshots...).

  **Test, Reset, Disable All.** Test ép event thành đúng bất kể trạng thái; Reset đưa event Active hoặc Test về Ready, hủy timer Wait đang chờ và các action While Active nhưng không hoàn tác action đã Latch. Disable All và Reset All là "nút panic" theo cách gọi của manual khi event chạy sai.

  ## Ví dụ (từ manual)

  - Fader input bất kỳ xuống dưới -60 dB: mute channel đó (Triggered Strip, Mute).
  - Meter input bất kỳ trên +3 dB trong 2 giây: bật Gain Guess trên channel đó; hoặc trong 3 giây: hạ fader 3 dB (Relative).
  - Gate của mic hát dự phòng đóng: mute input đó.
  - Footswitch đóng, Talkback, Toggle + Latch, hoặc On + While Active cho kiểu nhấn giữ để nói.
  - Fader Ch 1 vượt -60 dB: GPI Output 1 pulse 0,3 giây, tín hiệu "fader start" cho thiết bị playback.
  - Solo Aux bật: Load Layout để màn Sends on Faders spill vào một layout riêng.

  ## Dùng trên show thế nào

  1. Bắt đầu từ event mẫu, đổi tên, bấm Test thử trước khi mở cửa.
  2. Đặt Talkback bằng footswitch và Recall Next trong tầm tay; phím Function lấy tên của event có số thấp nhất đang dùng nó.
  3. Dùng While Active cho kiểu nhấn giữ để nói, Latch cho kiểu bật/tắt.
  4. Giữ sẵn một phím Disable All; rẻ hơn nhiều so với đi gỡ vòng lặp dưới đèn show.

  ## Bẫy thường gặp

  - Vòng lặp feedback: Event A recall Next ở snapshot 003, Event B recall Previous ở snapshot 004; console sẽ nhảy qua nhảy lại giữa chúng.
  - Bật "Use X/Y as Event Triggers/Actions" làm công tắc X và Y của channel không còn bật/tắt gate và compressor nữa.
  - Load một Events Preset thay toàn bộ event trong danh sách; muốn thêm vài cái thì đi đường Import Snapshots and Events.

  ## Điều CHƯA được xác minh

  - **Số cổng GPI.** Chương Events nói surface có 2 GPI input và 2 GPI output, còn bảng giới thiệu và trang GPI reference mô tả cổng DB25 với 8 input và 8 output. Manual tự mâu thuẫn; hãy đi dây theo trang GPI reference rồi test.
  - **Danh mục đầy đủ trigger và action.** Nằm trong một PDF riêng, Event Triggers and Actions, chưa mở.
  - Hành vi OSC trên show thật (độ trễ, định dạng thông điệp) ngoài các thiết lập đã liệt kê.
