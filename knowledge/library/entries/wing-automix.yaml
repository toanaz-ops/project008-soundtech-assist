summary: On WING, up to 16 channels can use automix in two groups, A and B, placed in the channel's post-insert slot. Only these facts come from the manual excerpt opened; weighting, algorithm type and menu paths are unverified.
summary_vi: Trên WING, tối đa 16 channel có thể dùng automix trong hai nhóm, A và B, đặt ở slot post-insert của channel. Chỉ những dữ kiện này lấy từ đoạn manual đã mở; weighting, loại thuật toán và đường dẫn menu chưa được xác minh.
body: |
  ## What the manual says (verified)

  An excerpt of the WING manual (SETUP > Audio and the HOME screen sections) states that automix regulates the level of several sources so that the output level stays uniform, with the example of several people speaking on stage at once. It says up to 16 channels can use automix, in two groups (A/B), and that the automix sits in the post-insert slot. That slot is the second insert, which the manual describes as fixed after the fader and after the processing; it can hold an effect or one of the two automix groups, which share gain across the channels assigned to them.

  ## What is NOT verified

  - **Algorithm.** The excerpt does not say whether WING uses gain-sharing (Dugan-style) or gating, or whether any numbers such as response time exist. Do not assume either.
  - **Weight.** Other consoles (for example Yamaha and Midas) have a per-channel weight or priority; the opened WING excerpt does not mention one. Check the full manual.
  - **Naming.** A retailer guide (seen only in search results) calls the groups Auto-X and Auto-Y, while the manual excerpt says A/B. Check the label on your firmware.
  - **Menu paths and meters.** Not read.

  ## How to apply it, using general automix behaviour

  The following comes from general automixer descriptions, not from a WING page:

  - Assign only the microphones that really share a speaking role, such as panel or table mics, into one group. Keep music inputs, playback and effects returns out of it.
  - Because the slot is after the fader, an idle channel with its fader down is seen at a lower level by the automixer. Yamaha advises the post-insert position (POST ON) for the same reason: it keeps idle channels from pulling gain and lets you favour a speaker with the fader.
  - Treat automix as a gain manager, not as a gate. Mute mics that are not in use.
  - Test with two people talking at once and with silence in the room before the show.
  - Use the second group for a separate set of mics (for example the presenters vs the audience Q&A mics) so one group does not penalise the other.

  ## Next step

  Open the full WING manual's automix section and record the algorithm, any weight control and the on-screen meters; then promote this entry from draft.
body_vi: |
  ## Manual nói gì (đã xác minh)

  Một đoạn trích manual WING (các mục SETUP > Audio và màn hình HOME) nêu rằng automix điều chỉnh mức của nhiều nguồn để mức đầu ra giữ đồng đều, với ví dụ nhiều người cùng nói trên sân khấu. Nó nói tối đa 16 channel có thể dùng automix, trong hai nhóm (A/B), và automix nằm ở slot post-insert. Slot đó là insert thứ hai, mà manual mô tả là cố định sau fader và sau phần xử lý; nó có thể chứa một effect hoặc một trong hai nhóm automix, share gain giữa các channel được gán vào.

  ## Điều CHƯA được xác minh

  - **Thuật toán.** Đoạn trích không nói WING dùng gain-sharing (kiểu Dugan) hay gating, hoặc có con số nào như thời gian đáp ứng không. Đừng giả định cái nào.
  - **Weight.** Các console khác (ví dụ Yamaha và Midas) có weight hoặc priority theo từng channel; đoạn trích WING đã mở không nhắc đến. Phải kiểm tra manual đầy đủ.
  - **Tên gọi.** Một hướng dẫn của nhà bán lẻ (chỉ thấy trong kết quả tìm kiếm) gọi các nhóm là Auto-X và Auto-Y, còn đoạn trích manual nói A/B. Kiểm tra nhãn trên firmware của bạn.
  - **Đường dẫn menu và meter.** Chưa đọc.

  ## Cách áp dụng, dựa trên hành vi automix nói chung

  Phần sau đây đến từ các mô tả automixer nói chung, không phải từ trang WING nào:

  - Chỉ gán vào một nhóm những mic thật sự cùng đảm nhận vai trò nói, như mic panel hoặc mic bàn. Giữ input nhạc, playback và effects return ngoài nhóm.
  - Vì slot nằm sau fader, một channel rảnh với fader kéo xuống được automixer thấy ở mức thấp hơn. Yamaha khuyên vị trí post-insert (POST ON) vì cùng lý do: nó giữ cho channel rảnh không kéo gain và cho phép bạn ưu tiên người nói bằng fader.
  - Coi automix là bộ quản lý gain, không phải gate. Mic nào không dùng thì mute.
  - Thử với hai người nói cùng lúc và với phòng im lặng trước show.
  - Dùng nhóm thứ hai cho một tập mic riêng (ví dụ presenter so với mic hỏi đáp của khán giả) để một nhóm không phạt nhóm kia.

  ## Bước tiếp theo

  Mở mục automix trong manual WING đầy đủ và ghi lại thuật toán, mọi điều khiển weight và các meter trên màn hình; sau đó nâng entry này khỏi trạng thái draft.
