    measured_vs_vocal_db: {kick: -10.5, snare: -14.1, drums_group: -10.0, bass: -6.9}
    by_genre:
      pop: {vocal.backing: -5, drums.kick: -10, drums.snare: -10, drums.tom: -12, drums.hihat: -18, drums.overhead: -14, instrument.bass: -7, instrument.guitar.electric: -9, instrument.guitar.acoustic: -8, instrument.keys: -8, instrument.strings: -10, instrument.horns: -9, speech.mc: 0, utility.playback: -6}
      rock: {instrument.guitar.electric: -6, drums.kick: -8, drums.snare: -8, instrument.bass: -6, instrument.keys: -10}
      ballad: {drums.kick: -14, drums.snare: -16, instrument.guitar.acoustic: -4, instrument.bass: -9, instrument.keys: -6}
      jazz: {instrument.bass: -5, drums.kick: -12, drums.snare: -14, instrument.horns: -6, instrument.keys: -8}
      edm: {utility.playback: [-6, -3]}
      bolero: {instrument.strings: -8, instrument.horns: -8}
      speech: {utility.playback: [-18, -12]}
  notes: "Only measured_vs_vocal_db comes from a source; genre rows are low confidence. Rock, ballad rows list only changes from pop."
