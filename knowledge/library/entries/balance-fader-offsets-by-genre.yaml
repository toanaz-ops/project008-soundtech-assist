id: balance-fader-offsets-by-genre
title: "First-pass balance offsets by source and genre"
title_vi: "Mức cân bằng ban đầu theo nguồn và thể loại"
topic: automix
tags:
  instrument: [vocal, kick, snare, bass, guitar, keys]
  genre: [pop, rock, ballad, jazz, edm, bolero, speech]
  technique: [balance, fader-offsets, relative-loudness]
  event: [concert, soundcheck]
summary: "Measured relative loudness of vocal, kick, snare and bass in finished mixes, and a per-genre offset table derived from it. Only the four measured figures are sourced; every genre table value is a low confidence starting point."
body: |
  ## What was measured

  A study of 8 multitrack mixes measured the perceived loudness of each processed source on its own, relative to the full mix. Averages, in loudness units: lead vocal about -2.7 LU, bass about -9.5 LU, rest of the drums as a group about -12.7 LU, kick about -13.2 LU, snare about -16.8 LU. Taking the lead vocal as the reference, that puts the kick roughly 10.5 below, the snare about 14 below, the drum group about 10 below and the bass about 7 below. Only the vocal's level differed significantly from the others.

  Two lessons follow. First, the old automatic-mixing assumption that every source should be equally loud is wrong for vocals: the lead sits clearly above everything else. Second, these are loudness offsets of processed sources, not fader positions. Faders depend on gain staging, EQ and compression, so the numbers need translating on the desk.

  ## The per-genre table

  The rule block holds offsets relative to the lead vocal (0 dB). They are derived from the measured figures plus engineering judgement; no study gives genre-resolved values.

  - **Pop**: backing vocals -5, kick -10, snare -10, toms -12, hi-hat -18, overheads -14, bass -7, electric guitar -9, acoustic guitar -8, keys -8, strings -10, horns -9, playback -6.
  - **Rock**: pop, but electric guitar -6, kick -8, snare -8, bass -6, keys -10.
  - **Ballad**: pop, but kick -14, snare -16, acoustic guitar -4, bass -9, keys -6.
  - **Jazz**: no source. Bass -5, kick -12, snare -14, horns -6, keys -8, ride and overheads prominent.
  - **EDM**: no source. Playback about -3 to -6 against the live vocal; kick and bass sit inside the playback.
  - **Bolero**: no source. Acoustic balance, vocal 0, strings -8, horns -8.
  - **Speech**: speaker 0, music or playback -12 to -18 under speech.

  ## How to use it

  Start the balance near these relationships, then set vocal first and bring the rest in underneath. Move for the room and the song. Expect the vocal to need to come up when the band is loud.

  ## Limits

  The study used recorded mixes, not live shows, and it reports relative loudness, not fader values. A second paper on automatic gain control for live mixing was only found as a record. All genre values are low confidence.
