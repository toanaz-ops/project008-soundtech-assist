summary: Measured relative loudness of vocal, kick, snare and bass in finished mixes, and a per-genre offset table derived from it. Only the four measured figures are sourced; every genre table value is a low confidence starting point.
summary_vi: Độ lớn tương đối đo được của vocal, kick, snare và bass trong các bản mix hoàn chỉnh, cùng bảng offset theo thể loại suy ra từ đó. Chỉ bốn con số đo được là có nguồn; mọi giá trị trong bảng thể loại chỉ là điểm xuất phát với độ tin cậy thấp.
body: |
  ## What was measured

  A study of 8 multitrack mixes measured the perceived loudness of each processed source on its own, relative to the full mix. Averages, in loudness units: lead vocal about -2.7 LU, bass about -9.5 LU, rest of the drums as a group about -12.7 LU, kick about -13.2 LU, snare about -16.8 LU. Taking the lead vocal as the reference, that puts the kick roughly 10.5 below, the snare about 14 below, the drum group about 10 below and the bass about 7 below. Only the vocal's level differed significantly from the others.

  Two lessons follow. First, the old automatic-mixing assumption that every source should be equally loud is wrong for vocals: the lead sits clearly above everything else. Second, these are loudness offsets of processed sources, not fader positions. Faders depend on gain staging, EQ and compression, so the numbers need translating on the desk.

  ## The per-genre table

  The rule block holds offsets relative to the lead vocal (0 dB). They are derived from the measured figures plus engineering judgement; no study gives genre-resolved values.

  - **Pop**: backing vocals -5, kick -10, snare -10, toms -12, hi-hat -18, overheads -14, bass -7, electric guitar -9, acoustic guitar -8, keys -8, strings -10, horns -9, playback -6.
  - **Rock**: pop, but electric guitar -6, kick -8, snare -8, bass -6, keys -10.
  - **Ballad**: pop, but kick -14, snare -16, acoustic guitar -4, bass -9, keys -6.
  - **Jazz**: no source. Bass -5, kick -12, snare -14, horns -6, keys -8, ride and overheads prominent.
  - **EDM**: no source. Playback about -3 to -6 against the live vocal; kick and bass sit inside the playback.
  - **Bolero**: no source. Acoustic balance, vocal 0, strings -8, horns -8.
  - **Speech**: speaker 0, music or playback -12 to -18 under speech.

  ## How to use it

  Start the balance near these relationships, then set vocal first and bring the rest in underneath. Move for the room and the song. Expect the vocal to need to come up when the band is loud.

  ## Limits

  The study used recorded mixes, not live shows, and it reports relative loudness, not fader values. A second paper on automatic gain control for live mixing was only found as a record. All genre values are low confidence.
body_vi: |
  ## Đã đo những gì

  Một nghiên cứu trên 8 bản mix multitrack đã đo độ lớn cảm nhận (perceived loudness) của từng nguồn đã xử lý, đứng riêng, so với toàn bộ mix. Trung bình, tính bằng loudness unit: lead vocal khoảng -2.7 LU, bass khoảng -9.5 LU, phần còn lại của bộ trống (tính chung một nhóm) khoảng -12.7 LU, kick khoảng -13.2 LU, snare khoảng -16.8 LU. Lấy lead vocal làm mốc thì kick thấp hơn khoảng 10.5, snare thấp hơn khoảng 14, nhóm trống thấp hơn khoảng 10 và bass thấp hơn khoảng 7. Chỉ mức của vocal là khác biệt có ý nghĩa thống kê so với các nguồn còn lại.

  Rút ra hai điều. Thứ nhất, giả định cũ của automatic mixing rằng mọi nguồn phải to bằng nhau là sai với vocal: lead nằm cao hơn hẳn mọi thứ khác. Thứ hai, đây là offset về độ lớn của các nguồn đã xử lý, không phải vị trí fader. Vị trí fader phụ thuộc vào gain staging, EQ và compression, nên bạn phải tự "dịch" các con số này sang mixer của mình.

  ## Bảng offset theo thể loại

  Khối rule chứa các offset so với lead vocal (0 dB). Chúng được suy ra từ các số đo ở trên cộng với phán đoán kỹ thuật; không có nghiên cứu nào cho giá trị theo từng thể loại.

  - **Pop**: backing vocal -5, kick -10, snare -10, tom -12, hi-hat -18, overhead -14, bass -7, guitar điện -9, guitar acoustic -8, keys -8, strings -10, horns -9, playback -6.
  - **Rock**: như pop, nhưng guitar điện -6, kick -8, snare -8, bass -6, keys -10.
  - **Ballad**: như pop, nhưng kick -14, snare -16, guitar acoustic -4, bass -9, keys -6.
  - **Jazz**: không có nguồn. Bass -5, kick -12, snare -14, horns -6, keys -8, ride và overhead nổi.
  - **EDM**: không có nguồn. Playback khoảng -3 đến -6 so với vocal live; kick và bass nằm trong playback.
  - **Bolero**: không có nguồn. Cân bằng acoustic, vocal 0, strings -8, horns -8.
  - **Speech**: người nói 0, nhạc hoặc playback thấp hơn tiếng nói -12 đến -18.

  ## Cách dùng

  Bắt đầu cân bằng gần các quan hệ này, đặt vocal trước rồi đưa phần còn lại vào bên dưới. Sau đó chỉnh theo phòng và theo bài. Band càng to thì vocal càng phải được đẩy lên.

  ## Giới hạn

  Nghiên cứu dùng các bản mix thu sẵn, không phải show live, và báo cáo độ lớn tương đối chứ không phải giá trị fader. Bài báo thứ hai về automatic gain control cho live mixing chỉ tìm thấy ở dạng bản ghi tham khảo. Tóm lại, mọi giá trị theo thể loại đều có độ tin cậy thấp: dùng để xuất phát, không dùng để chốt.
