summary: |
  A practical starting chain for a lead vocal on a live desk: clean gain, a high-pass filter,
  gentle low-mid and harshness control, light compression, de-essing only as needed, and the
  fader as the final dynamics tool. Every number is a starting point to be corrected by ear.
summary_vi: 'Chuỗi khởi đầu thực tế cho lead vocal trên desk live: gain sạch, high-pass filter, kiểm soát low-mid và harshness nhẹ nhàng, compression nhẹ, de-essing chỉ khi cần, và fader là công cụ dynamics cuối cùng. Mọi con số là điểm khởi đầu để sửa bằng tai.'
body: |
  **Start with the source, not the processing.** A dynamic or condenser handheld that the singer
  actually holds close and steady beats any plug-in repair. Set gain with the singer performing
  at full effort (not a polite "check, one two"), leave headroom for the loudest chorus, then
  build the vocal on top of the rhythm section before touching effects.

  **High-pass filter.** The low cut removes stage rumble, handling noise and plosive energy, and
  it tames the bass tip-up of a close cardioid (see `vocal-proximity-effect`). A common live
  window is roughly 80-125 Hz. One approach from Sound On Sound is to raise the cutoff until the
  tone of the voice just starts to change, then back off a touch. Live engineers often go higher
  than a studio engineer would, because a singer moving on and off the mic makes the low end
  unstable. A male lead with a deep voice needs the lower end of the window; a thin voice may
  need almost none.

  **EQ problem areas.** Think in zones rather than magic numbers. Below about 300 Hz the voice
  gets boomy when the singer leans in. Around 200 Hz to 1 kHz a broad, small cut clears "mud"
  without making the voice sterile, and Waves suggests a small cut near 200 Hz. Cut first, boost
  last: a broad boost in the presence region is better than a narrow one, and boosting a lot
  above 3 kHz makes a vocal harsh before it makes it airy. Keep the monitors in mind: every dB
  of boost in the mic's feedback-prone region costs gain before feedback.

  **Compression.** The aim is to catch the loudest phrases, not to flatten the singer. Start with
  a modest ratio (around 2:1 to 4:1), a medium attack so the front of each syllable still cuts
  through, and a release that follows the phrasing. Heavy gain reduction raises the noise floor
  and stage spill, which hurts you in a small room. Multiband compression on the very low and
  very high bands can calm the timbre changes caused by head movement.

  **De-essing.** Compression pushes sibilance up, so de-ess after it, and only if "s" and "sh"
  are actually harsh. Sibilance usually lives in the upper mids and highs (very roughly 4-8
  kHz; find it by sweeping a narrow boost). Sound On Sound also notes that "k", "f" and "t"
  harshness often responds better to a dynamic EQ band or transient control than to a de-esser.
  Over-doing it gives a lisp; back off the threshold.

  **The fader is the real compressor.** No processing replaces riding the vocal: pull it down on
  a shouted phrase, push it up in a whispered verse, and ride the effect return too so reverb
  does not wash over quiet passages. On a WING, putting the vocal on its own fader layer with
  the channel compressor feeding a vocal bus keeps one hand free for riding.

  **Common mistakes:** over-aggressive HPF that thins the voice, boosting highs to "cut through"
  instead of fixing the mix around it, de-essing before compression, and setting everything
  during sound check and never revisiting it between songs.
body_vi: |
  **Bắt đầu từ nguồn, không phải từ xử lý.** Một handheld dynamic hoặc condenser mà ca sĩ thực sự cầm sát và ổn định thắng mọi plug-in sửa chữa. Set gain khi ca sĩ hát hết sức (không phải câu "check, one two" lịch sự), chừa Headroom cho đoạn chorus to nhất, rồi dựng vocal lên trên rhythm section trước khi đụng đến effect.

  **High-pass filter.** Low cut loại bỏ rumble sân khấu, handling noise và năng lượng plosive, và nó kiềm bass tip-up của cardioid gần (xem `vocal-proximity-effect`). Khoảng thường dùng ở live là xấp xỉ 80-125 Hz. Một cách của Sound On Sound là nâng cutoff đến khi tiếng giọng vừa bắt đầu đổi, rồi lùi lại một chút. Kỹ sư live thường đặt cao hơn kỹ sư studio, vì ca sĩ di chuyển ra vào mic làm low end không ổn định. Lead nam giọng trầm cần ở đầu thấp của khoảng này; giọng thin (mỏng) có thể gần như không cần.

  **Vùng EQ có vấn đề.** Hãy nghĩ theo vùng thay vì con số thần kỳ. Dưới khoảng 300 Hz giọng bị boomy (ù, rền) khi ca sĩ ghé sát. Quanh 200 Hz đến 1 kHz, một cut nhỏ, rộng làm sạch "mud" (đục, bí) mà không làm giọng vô trùng, và Waves gợi ý một cut nhỏ gần 200 Hz. Cut trước, boost sau cùng: boost rộng ở vùng presence tốt hơn boost hẹp, và boost nhiều trên 3 kHz làm vocal harsh trước khi làm nó có air. Nhớ đến monitor: mỗi dB boost ở vùng dễ feedback (hú rít) của mic đều tốn gain before feedback.

  **Compression.** Mục tiêu là chộp những câu to nhất, không phải ép dẹt ca sĩ. Bắt đầu với Ratio vừa phải (khoảng 2:1 đến 4:1), Attack trung bình để phần đầu mỗi âm tiết vẫn xuyên qua, và Release theo cách ngắt câu. Gain Reduction nặng nâng noise floor (sàn nhiễu) và stage spill, gây hại cho bạn trong phòng nhỏ. Multiband compression trên các band rất thấp và rất cao có thể làm dịu thay đổi âm sắc do ca sĩ di chuyển đầu.

  **De-essing (xử lý âm xuýt).** Compression đẩy sibilance lên, nên de-ess sau nó, và chỉ khi "s" và "sh" thật sự harsh. Nếu nén trước thì de-esser sẽ hiểu sai. Sibilance thường nằm ở upper mid và high (rất xấp xỉ 4-8 kHz; tìm bằng cách sweep một boost hẹp). Sound On Sound cũng lưu ý harshness của "k", "f" và "t" thường hợp với một band Dynamic EQ hoặc transient control hơn là de-esser. Làm quá sẽ thành tật nói ngọng; hãy nới Threshold.

  **Fader mới là compressor thật.** Không xử lý nào thay được việc riding vocal: kéo xuống ở câu hét, đẩy lên ở đoạn thì thầm, và ride cả effect return để reverb không tràn lên các đoạn nhỏ. Trên WING, đặt vocal lên một fader layer riêng với channel compressor cấp vào một vocal bus giúp rảnh một tay để ride.

  **Lỗi thường gặp:** HPF quá mạnh làm giọng thin, boost cao để "xuyên qua" thay vì sửa mix xung quanh, de-ess trước compression, và set mọi thứ lúc soundcheck rồi không xem lại giữa các bài.
