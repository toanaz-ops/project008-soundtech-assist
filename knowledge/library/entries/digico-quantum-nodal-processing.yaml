summary: On Quantum, an aux send (a node) can carry its own EQ and dynamics, so one channel can sound different in each monitor or IEM mix. Quantum-only; the Q338 has 64 nodal processors (72 with Pulse).
summary_vi: Trên Quantum, mỗi aux send (một node) có thể mang EQ và dynamics riêng, nên cùng một channel có thể nghe khác nhau ở từng mix monitor hoặc IEM. Chỉ có trên Quantum; Q338 có 64 nodal processor (72 với Pulse).
body: |
  ## What it is (verified, reference manual PDF pp. 35-37, 114)

  The Aux Nodes panel (Layout > Aux Nodes) is on all consoles, but Nodal Processing is marked Quantum only. Each aux node send can have SD Nodal EQ and Dynamics inserted in its audio path. The maximum number of simultaneous nodes depends on the Quantum model; the Q338 datasheet gives 64 (72 with Pulse), and the number in use shows in the Diagnostics panel. The datasheet lists each nodal processor as a 4-band parametric or dynamic EQ plus DYN 1 (compressor, multiband compressor, de-esser) and DYN 2 (gate, duck, external-input compressor). The brochure describes this as turning an aux send into its own channel.

  ## Steps on the console

  1. Open Layout > Aux Nodes (input/groups view or aux buss view).
  2. Touch **Add**, then the aux node: nodal processing is active for that send. A purple "P" appears next to the node on/off button and in the channel strip's aux display.
  3. Touch the node: EQ and dynamics controls appear together on the screen where the channel sits; a node-function panel is bottom right.
  4. **Bypass** toggles it temporarily (not recalled by snapshots). **Remove** deletes it. **Solo node** solos that node (green "s").
  5. Copy To / Copy From / Copy From Channel copies settings from another node or from channel-strip dynamics.

  Snapshots and safes: each nodal processor has its own entry in snapshot scopes and in the channel list; since V1260 aux sends/nodes (including nodal processing) can be safed individually. The option "Solo displays aux nodal processing" opens the node's expanded view when you solo an aux master that has a node.

  ## Why a live engineer uses it (common practice, not from the manual)

  Give the drummer's IEM a compressed vocal while the singer's own mix stays open, or notch a feedback-prone frequency in one wedge mix only, without touching the channel. Pair with True Solo (`digico-quantum-true-solo`).

  ## Pitfalls

  Bypass is not snapshot-recallable; the node pool is finite; every node is one more thing to check at soundcheck.

  ## What is NOT verified

  - First software version for Nodal Processing and any licence (the datasheet options list does not include it).
  - Whether WING has an equivalent per-send processing: not checked here.
  - Whether the aux send's pre/post position changes where nodal processing sits relative to the fader: not stated in the pages read.
  - The on-desk operation diagram is a schematic drawn from the manual's description; the exact position of controls on the real screen or surface may differ.
body_vi: |
  ## Nó là gì (đã xác minh, reference manual PDF tr. 35-37, 114)

  Panel Aux Nodes (Layout > Aux Nodes) có trên mọi console, nhưng Nodal Processing được ghi Quantum only. Mỗi aux node send có thể chèn SD Nodal EQ và Dynamics vào đường tín hiệu của nó. Số node tối đa cùng lúc tuỳ model Quantum; datasheet Q338 ghi 64 (72 với Pulse), và số đang dùng hiện trong panel Diagnostics. Datasheet liệt kê mỗi nodal processor có EQ parametric 4 band hoặc dynamic EQ cộng DYN 1 (compressor, multiband compressor, de-esser) và DYN 2 (gate, duck, compressor input ngoài). Brochure mô tả nó là biến một aux send thành một channel riêng.

  ## Các bước trên console

  1. Mở Layout > Aux Nodes (view input/groups hoặc aux buss).
  2. Chạm **Add**, rồi chạm aux node: nodal processing được bật cho send đó. Chữ "P" màu tím hiện cạnh nút on/off của node và trong phần aux của channel strip.
  3. Chạm node: điều khiển EQ và dynamics hiện cùng lúc trên màn hình chứa channel; panel chức năng node nằm góc dưới bên phải.
  4. **Bypass** tắt tạm (snapshot không recall). **Remove** xoá. **Solo node** solo node đó (chữ "s" xanh).
  5. Copy To / Copy From / Copy From Channel chép thiết lập từ node khác hoặc từ dynamics của channel strip.

  Snapshot và safe: mỗi nodal processor có mục riêng trong snapshot scope và trong danh sách channel; từ V1260 aux send/node (kể cả nodal processing) safe riêng được. Tuỳ chọn "Solo displays aux nodal processing" mở view mở rộng của node khi bạn solo một aux master có node.

  ## Vì sao dân live dùng (kinh nghiệm thông thường, không từ manual)

  Cho IEM của tay trống một vocal đã nén trong khi mix của ca sĩ vẫn mở, hoặc notch tần số dễ feedback chỉ ở một mix wedge mà không đụng tới channel. Kết hợp với True Solo (`digico-quantum-true-solo`).

  ## Bẫy thường gặp

  Bypass không recall theo snapshot; bể node hữu hạn; mỗi node thêm một thứ phải kiểm tra lúc soundcheck.

  ## Điều CHƯA được xác minh

  - Phiên bản software đầu tiên có Nodal Processing và licence (danh sách option của datasheet không có).
  - WING có tính năng xử lý theo từng send tương đương không: chưa kiểm ở đây.
  - Vị trí pre/post của aux send có ảnh hưởng chỗ nodal processing so với fader không: các trang đã đọc không nêu.
  - Sơ đồ thao tác trên bàn là sơ đồ minh hoạ vẽ theo mô tả trong manual; vị trí thật của control trên màn hình hoặc surface có thể khác.
