summary: SD Control Groups move the faders, mutes and solos of any mix of input and output channels from one fader, in three modes. They are not group busses; no audio is routed through them.
summary_vi: Control Group trên SD điều khiển fader, mute và solo của một tập input và output channel bất kỳ từ một fader, ba chế độ. Chúng không phải group bus; không có audio nào đi qua chúng.
body: |
  ## What the manual says (Issue H, V20+)

  - Any number of input and output channels can belong to one or more Control Groups (CG). The CG fader, mute and solo are applied to all assigned channels. The number of CGs is set in Session Structure; the SD10 product page lists 24.
  - A CG is **not** a group channel: group channels mix routed audio, while a CG only moves faders of the assigned channels, whatever the audio routing.
  - **Making a CG:** either use the LCD Function button on the CG fader bank, then JOIN CG, select the CG, then press the select buttons of the members; or press JOIN/LEAVE on the CG strip in the Control Groups display and select members. Clear removes all members.
  - **Three fader modes** (button below Clear): moving fader (member faders move), VCA style (member output level changes without moving faders), mute only. In all three, a change replicates as a dB change, not as fader distance. A channel's own fader still works independently and does not affect the other members.
  - **Mutes:** the CG mute mutes all members, and member mute buttons light blue to show the CG is responsible. When a channel is in several CGs, all must be off for it to unmute. The channel's own mute button overrides CG mutes without removing it from the CG. Auto-mute mutes a channel removed from a CG and unmutes one that joins.
  - A CG SAFE button protects assignments and settings from snapshot recall. Control Group members are also a Recall Scope item.
  - **Control Group Spill** (manual marks 1272+): spill the members directly from the CG strip, or with a macro. **CG Aux Send Enable** (V1445+): with Aux to Faders active, the CG fader acts as a trim for all sends on the selected aux.

  ## How to use it on a show

  1. Make CGs by role: drums, backing vocals, guitars, playback.
  2. Choose VCA style if you want to leave the faders where they are; choose moving fader if you want the surface to show the move.
  3. Use the CG mute with auto-mute for scene changes where a band's channels must go quiet together.
  4. Combine with a snapshot: keep CG membership in scope, or safe the CG so a snapshot does not rearrange it.

  ## Pitfalls

  - A CG does not change audio routing. If you assume it sums audio, a post-fader bus will not follow.
  - Only the first two or three CG assignments fit in the channel strip display.
  - CG mute overridden by the channel's own mute: watch which button is lit.

  ## Compared with WING

  WING's DCA groups are the closest equivalent; this entry did not check their behaviour, so differences are not stated.

  ## What is NOT verified

  - Whether VCA-style CGs respect post-fader inserts or automix. Not covered in the pages read.
body_vi: |
  ## Manual nói gì (Issue H, V20+)

  - Bất kỳ số input và output channel nào cũng có thể thuộc một hoặc nhiều Control Group (CG). Fader, mute và solo của CG áp lên mọi channel được gán. Số CG đặt trong Session Structure; trang sản phẩm SD10 ghi 24.
  - CG **không phải** group channel: group channel mix audio được route vào, còn CG chỉ di chuyển fader của các channel được gán, bất kể routing audio.
  - **Tạo CG:** hoặc dùng nút LCD Function trên bank CG fader, rồi JOIN CG, chọn CG, rồi bấm nút select của các thành viên; hoặc bấm JOIN/LEAVE trên strip CG trong màn hình Control Groups rồi chọn thành viên. Clear xoá hết thành viên.
  - **Ba chế độ fader** (nút bên dưới Clear): moving fader (fader thành viên chạy theo), VCA style (mức output thành viên đổi mà fader không chạy), mute only. Cả ba đều nhân bản thay đổi theo dB, không theo khoảng cách fader. Fader riêng của channel vẫn chạy độc lập và không ảnh hưởng thành viên khác.
  - **Mute:** CG mute sẽ mute mọi thành viên, nút mute của thành viên sáng xanh để cho thấy CG đang chịu trách nhiệm. Khi một channel thuộc nhiều CG, tất cả phải tắt thì nó mới unmute. Nút mute riêng của channel ghi đè CG mute mà không đuổi nó khỏi CG. Auto-mute mute channel bị đưa ra khỏi CG và unmute channel mới vào.
  - Nút SAFE của CG bảo vệ assignment và setting khỏi snapshot recall. Control Group Members cũng là một mục trong Recall Scope.
  - **Control Group Spill** (manual ghi 1272+): spill thành viên trực tiếp từ strip CG, hoặc bằng macro. **CG Aux Send Enable** (V1445+): khi Aux to Faders đang bật, fader CG đóng vai trò trim cho mọi send trên aux đang chọn.

  ## Cách dùng trên show

  1. Lập CG theo vai trò: drums, backing vocals, guitars, playback.
  2. Chọn VCA style nếu muốn để fader nguyên chỗ; chọn moving fader nếu muốn surface thể hiện chuyển động.
  3. Dùng CG mute cùng auto-mute cho lúc đổi cảnh, khi channel của một ban nhạc phải im cùng lúc.
  4. Kết hợp với snapshot: giữ CG membership trong scope, hoặc safe CG để snapshot không sắp xếp lại nó.

  ## Bẫy thường gặp

  - CG không đổi routing audio. Nếu nghĩ nó cộng audio thì bus post-fader sẽ không đi theo.
  - Chỉ hai hoặc ba CG assignment đầu hiển thị vừa trong channel strip.
  - CG mute bị mute riêng của channel ghi đè: nhìn xem nút nào đang sáng.

  ## So với WING

  DCA group của WING là thứ gần nhất; mục này chưa kiểm tra hành vi của chúng nên không nêu khác biệt.

  ## Điều CHƯA được xác minh

  - VCA-style CG có tôn trọng insert post-fader hay automix không. Các trang đã đọc không nói.
