  event: [concert]
summary: "In rock the mix is built around drums, bass and a vocal that must cut through loud guitars. The common problems are kick and bass fighting for the same low end and guitars burying the vocal."
body: |
  ## Balance

  Rock leans on the rhythm section and a vocal that sits in the midrange. One iZotope author, mixing in a studio, advises keeping the vocal focused in the mids rather than adding a lot of bright treble, leaving the top end to the cymbals. Distortion on the high mids can work on guitars but a distorted top end tends to sound bad on a voice. In a live room the same idea applies: carve guitar space around the vocal instead of just pushing the vocal fader.

  ## Low end

  Kick and bass share the lowest octaves, so decide who owns what. The iZotope author lets the bass dominate the low end with the kick sitting just above it, using a gentle shelf on the bass and a dynamic dip around 100 Hz while the kick hits. SOS offers the opposite shaping option: set the kick around the bass, boost the kick near 70 to 90 Hz for punch, and cut about an octave higher to reduce boxiness. Sidechain-ducking the bass by about 3 dB when the kick hits sounds natural, with harder rock using more. These two SOS and iZotope pieces are studio-focused; the principle carries over, but check by ear in the room and in the sub.

  If a bass is taken both from a DI and a mic, check polarity. SOS (Burton) notes that phase problems between the two can thin the low end; flip one polarity and listen from where stage and PA are balanced.

  ## Dynamics

  A compressor on bass with slow attack lets transients through while controlling the tail; slap playing needs faster attack, with a medium release so it recovers before the next note. Over-editing and over-tuning remove the imperfection that gives rock its groove, so fix only the worst problems.

  ## Effects

  Rock vocals tend to sit drier than ballads; keep reverb to the snare and a short ambience, and delay for emphasis rather than a constant wash. Parallel compression on drums is a common way to add weight without flattening transients (iZotope).

  ## Common mistakes

  - Boosting rhythm-guitar lows, which clouds the mix and fights the bass.
  - Judging the bass solo. Mute it and check what remains in the low end.
  - Leaving the kick and bass both full-range into the subwoofers.

  Every number here is a starting point from magazine and vendor articles, mostly written for studio mixes. I found no reputable live-rock source that gives dB or Hz targets for the whole genre, so none is given beyond what is cited.
