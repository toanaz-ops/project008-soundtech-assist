summary: A gated automixer puts a gate on every microphone and lowers the whole group as more mics open; the reduction for N open mics is 10·log10(N) dB, about 3 dB per doubling. A last-mic-on setting keeps one channel open so the room never goes dead.
summary_vi: Gated automixer đặt một gate lên mỗi mic và hạ cả nhóm xuống khi càng nhiều mic mở; mức giảm cho N mic đang mở là 10·log10(N) dB, tức khoảng 3 dB mỗi lần số mic tăng gấp đôi. Chế độ last-mic-on giữ một channel luôn mở để phòng không bao giờ "chết tiếng".
body: |
  ## What a gated automixer does

  Each channel behaves like a noise gate that is either open or closed. A mic opens when its level rises far enough above the tracked background noise on that channel, and it stays open for a hold time so short pauses do not chop words. Because the threshold follows the noise floor, an air-conditioning unit switching on does not force every mic open.

  ## NOM attenuation

  When several mics are open at once the combined gain rises, and so does feedback risk. NOM (number of open microphones) attenuation fights that by turning the whole group down as more mics open. The usual law is:

  attenuation = 10 · log10(NOM) dB

  That gives 0 dB for one mic, about 3 dB for two, 6 dB for four, 9 dB for eight, 12 dB for sixteen: roughly 3 dB each time the count doubles. The diagram below plots the curve (plain maths, not a manufacturer table). One vendor implements it as a 3 dB step per doubling by default, with a maximum-attenuation cap and an optional linear mode that steps per mic instead. Other vendors name and default things differently, so read your own manual.

  ## Last mic on

  If every mic gates shut, the room sounds unnaturally silent and, on a call, the far end thinks the line dropped. "Last mic on" keeps the most recently active channel open when nothing else is. Some mixers instead let you nominate a default channel; on one vendor's mixer the two options are mutually exclusive.

  ## Other controls worth knowing

  - **Maximum open mics**: caps the count; when the limit is exceeded the longest-open mic closes.
  - **Side-chain filter**: the detector can ignore low-frequency rumble without filtering the audio itself.
  - **Gating on the loudest mic only**: when one talker feeds several mics, only the loudest opens, which reduces comb-filtering from multiple open mics.
  - **Manual open**: a channel forced open by hand typically does not count towards NOM.

  ## Strengths and weaknesses

  Gating gives the most control in awkward rooms and with many mics, but it can chatter, clip the first syllable if the threshold is wrong, and makes the room tone jump. Gain-sharing avoids those artefacts; see the Dugan entry. Starting settings for hold time and depth vary by product and the cited pages give no numbers, so none are given here.
body_vi: |
  ## Gated automixer làm gì

  Mỗi channel hoạt động như một noise gate chỉ có hai trạng thái: mở hoặc đóng, giống "đóng cửa khi vắng khách". Mic chỉ mở khi level của nó vượt đủ xa so với sàn nhiễu (Noise floor) được theo dõi trên channel đó, và giữ mở trong một khoảng Hold để những quãng ngắt ngắn không làm đứt chữ. Vì Threshold bám theo Noise floor, máy lạnh bật lên cũng không kéo tất cả mic mở theo.

  ## Giảm gain theo số mic mở (NOM attenuation)

  Khi nhiều mic cùng mở, tổng gain của hệ thống tăng lên và nguy cơ feedback cũng tăng theo. NOM (number of open microphones) attenuation xử lý đúng chỗ này: càng nhiều mic mở thì cả nhóm càng bị hạ xuống. Công thức thường dùng:

  attenuation = 10 · log10(NOM) dB

  Kết quả: 0 dB cho một mic, khoảng 3 dB cho hai mic, 6 dB cho bốn, 9 dB cho tám, 12 dB cho mười sáu. Nói gọn là khoảng 3 dB mỗi lần số mic tăng gấp đôi. Biểu đồ bên dưới vẽ đường cong này (toán thuần, không phải bảng của hãng nào). Một hãng triển khai nó là bước 3 dB cho mỗi lần gấp đôi theo mặc định, kèm giới hạn maximum-attenuation và một chế độ linear tùy chọn giảm theo từng mic. Các hãng khác đặt tên và giá trị mặc định khác nhau, nên bạn bắt buộc phải đọc manual của chính mixer đang dùng.

  ## Last mic on

  Nếu mọi mic đều gate đóng, phòng nghe im lặng một cách không tự nhiên, và trong cuộc gọi thì đầu bên kia tưởng đường truyền bị rớt. "Last mic on" giữ channel vừa hoạt động gần nhất ở trạng thái mở khi không còn channel nào khác mở. Một số mixer thay vào đó cho chỉ định một channel mặc định; trên mixer của một hãng, hai tùy chọn này loại trừ nhau.

  ## Các thông số khác nên biết

  - **Maximum open mics**: giới hạn số mic mở; khi vượt giới hạn, mic mở lâu nhất sẽ đóng.
  - **Side-chain filter**: detector có thể bỏ qua tiếng rumble tần số thấp mà không cần lọc chính tín hiệu audio.
  - **Gating on the loudest mic only**: khi một người nói vào nhiều mic, chỉ mic to nhất được mở, nhờ vậy giảm được comb filtering do nhiều mic mở cùng lúc.
  - **Manual open**: channel bị ép mở bằng tay thường không được tính vào NOM.

  ## Ưu và nhược điểm

  Gating cho khả năng kiểm soát tốt nhất trong phòng khó và khi có nhiều mic, nhưng nó có thể chatter, mất âm đầu của từ nếu Threshold sai, và làm room tone nhảy lên xuống. Gain-sharing tránh được các lỗi đó; xem mục Dugan. Giá trị khởi điểm cho Hold và độ sâu khác nhau tùy sản phẩm và các trang được trích dẫn không cho con số nào, nên ở đây cũng không đưa ra.
