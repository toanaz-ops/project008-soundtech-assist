summary: "Pop shows centre on a clear, often compressed lead vocal over dense playback. The job is making space for the live voice and stopping bright backing tracks from masking it."
body: |
  ## Balance

  The lead vocal is the focus, and most of the craft is making room for it. Carve space in competing instruments with EQ, or a multiband compressor on the instrument bus sidechained to the vocal bus so it ducks the clashing frequencies only when the singer is active (Harman, Casamatta). Pop mixes are tight and dense, so there is little tolerance for a vocal that drifts in level.

  ## Vocal chain

  Casamatta's suggested order: high-pass and maybe a low shelf to remove rumble and mud; compression with a fast attack, the threshold set so consonants pass cleanly, and a release timed to the song's tempo; a de-esser aimed at roughly 3 to 6 kHz; then a final EQ that lifts the high mids for lyric clarity or adds some air. He notes that in pop the vocal sits fairly dry, so heavy compression works as an effect in its own right. Pitch correction, if used, should be an insert that can be bypassed and should be agreed with the artist first.

  ## Tracks and playback

  Pre-recorded vocals and other parts are common. Two fixes appear in both Casamatta pieces: ask the artist to re-record the playback vocals with the microphone they sing on live, and put a high shelf on the playback to take the edge off bright, heavily compressed tracks so the live voice stays audible. Check the playback level against the live band at line check and leave headroom on its channels.

  ## Low end and dynamics

  Playback often carries synth bass and sub; high-pass everything that does not need low end, and make sure the playback sub does not double a live bass part. The 2003 SOS piece on live playback also reminds you that a low-cut on the channel reduces booming and feedback.

  ## Effects

  Casamatta says pop vocals "tend to be on the dry end" of reverb and delay. A tempo-synced delay or short plate reverb adds size without washing the words; see the reverb and delay entries.

  ## Common mistakes

  - Letting bright playback tracks sit on top of the live voice.
  - Over-compressing backing vocals so the lead loses focus.
  - Over-tuning without talking to the artist.

  The two Casamatta articles are the same author; treat them as one voice. I found no source giving numbers for levels or reverb times in pop, so none are given beyond the cited de-esser range.
