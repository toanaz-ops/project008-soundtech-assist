summary: Minimum-phase EQ shifts phase near the adjusted bands but adds almost no delay; linear-phase EQ keeps phase relationships but delays the whole signal. Live work favours minimum phase because delay is costly.
summary_vi: EQ pha tối thiểu (Minimum-phase) làm lệch phase quanh các band được chỉnh nhưng gần như không thêm delay; EQ pha tuyến tính (Linear-phase) giữ nguyên quan hệ phase nhưng làm trễ toàn bộ tín hiệu. Live ưu tiên Minimum-phase vì delay rất đắt.
body: |
  Every analogue-style EQ band changes the phase of the signal around the frequencies it adjusts. That behaviour is called minimum phase. A linear-phase EQ is built to avoid this phase change and delays every frequency by the same amount instead.

  ## What you get with each
  - **Minimum phase:** negligible latency, low CPU, and a phase shift that is hard to hear in most material. Phase changes can even sound pleasing and are part of the character of many classic EQs.
  - **Linear phase:** no phase change, so phase relationships between related sources stay intact. The price is latency (often tens of milliseconds, depending on the plug-in and mode), higher CPU, and pre-ringing on very steep or narrow filters.

  ## When linear phase is worth it
  In recording and mastering it helps with sources captured by several close microphones, such as a drum kit, snare top/bottom, or stereo piano and guitar pairs, where phase differences are most audible. Narrow surgical cuts and steep high-pass filters are another typical case. Some plug-ins let you blend between the two.

  ## Why live sound stays with minimum phase
  - The channel feeds the PA and monitors in real time; extra delay on one channel makes it arrive late relative to the rest and to the acoustic sound from the stage. Singers on in-ear monitors notice delay quickly.
  - A bus with linear-phase processing delays everything routed through it, so channels that bypass it drift out of time.
  - Console EQs, including the WING channel EQ, are built as low-latency minimum-phase filters. Use them as such.
  - If you must use a plug-in or an outboard linear-phase processor, check its latency and compensate.

  ## Practical advice
  1. Default to minimum phase for tone shaping.
  2. If the sound of a multi-mic source (drums) suffers from stacked EQ, reduce the number of EQ moves, or use the same EQ settings across the paired mics, before reaching for a delay-adding tool.
  3. Do not stack many linear-phase processors in a live path.

  ## Contested point
  Sources agree on the trade-off but disagree on how audible minimum-phase shift is; most say it is hard to hear, others value linear phase for corrective work. Treat it as a judgement call.
body_vi: |
  Mỗi band EQ kiểu analogue đổi phase của tín hiệu quanh các tần số nó chỉnh. Hành vi đó gọi là Minimum-phase. EQ Linear-phase được thiết kế để tránh việc đổi phase này, thay vào đó làm trễ mọi tần số một lượng như nhau.

  ## Mỗi loại cho bạn gì
  - **Minimum-phase:** latency không đáng kể, CPU thấp, và độ lệch phase khó nghe ra ở đa số chất liệu. Thay đổi phase thậm chí có thể nghe dễ chịu và là một phần chất của nhiều EQ kinh điển.
  - **Linear-phase:** không đổi phase, nên quan hệ phase giữa các nguồn liên quan được giữ nguyên. Cái giá là latency (thường hàng chục mili giây, tuỳ plug-in và chế độ), CPU cao hơn, và pre-ringing trên filter rất dốc hoặc rất hẹp.

  ## Khi nào Linear-phase đáng dùng
  Khi thu âm và mastering, nó giúp với các nguồn được thu bằng nhiều mic gần như drum kit, snare top/bottom, hoặc cặp stereo piano và guitar, nơi chênh lệch phase dễ nghe nhất. Cut hẹp kiểu phẫu thuật và high-pass dốc là một trường hợp điển hình khác. Một số plug-in cho phép blend giữa hai loại.

  ## Vì sao live sound ở lại với Minimum-phase
  - Channel cấp tín hiệu cho PA và monitor real-time; thêm delay trên một channel làm nó đến trễ so với phần còn lại và so với tiếng acoustic từ stage. Ca sĩ dùng IEM nhận ra delay rất nhanh.
  - Một bus xử lý Linear-phase làm trễ mọi thứ đi qua nó, nên các channel bỏ qua bus đó bị lệch thời gian.
  - EQ của console, kể cả channel EQ của WING, được xây dưới dạng filter Minimum-phase latency thấp. Hãy dùng chúng đúng như vậy.
  - Nếu bắt buộc dùng plug-in hoặc outboard Linear-phase, hãy kiểm tra latency của nó và bù lại.

  ## Lời khuyên thực tế
  1. Mặc định dùng Minimum-phase để tạo hình tiếng.
  2. Nếu tiếng của nguồn nhiều mic (drums) bị hỏng vì EQ chồng EQ, hãy giảm số lần chỉnh EQ, hoặc dùng cùng setting EQ cho các mic ghép cặp, trước khi nghĩ đến công cụ thêm delay.
  3. Đừng chồng nhiều processor Linear-phase trong đường live.

  ## Điểm còn tranh cãi
  Các nguồn đồng ý về sự đánh đổi nhưng bất đồng về độ nghe được của lệch phase Minimum-phase; đa số nói là khó nghe, một số khác đánh giá cao Linear-phase cho việc sửa lỗi. Tóm lại, đây là một phán đoán tuỳ người.
