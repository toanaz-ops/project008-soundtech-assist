summary: Several studies set channel faders automatically from measured loudness. One found listeners preferred a simple energy-based balance over a complex psychoacoustic model; others warn that making every track equally loud gives a poor mix, so a per-instrument target is needed.
summary_vi: Một số nghiên cứu tự động set fader từ loudness đo được. Một nghiên cứu thấy người nghe thích cách cân bằng đơn giản dựa trên năng lượng (energy) hơn là mô hình psychoacoustic phức tạp; các nghiên cứu khác cảnh báo rằng ép mọi track lớn bằng nhau sẽ ra bản mix tệ, nên mỗi nhạc cụ cần một target riêng.
body: |
  ## The question

  If you could measure how loud each channel is, could a program set a sensible starting balance? Researchers have tried it with simple level measures, with loudness standards, and with full psychoacoustic models. The lessons are useful when you want a quick first balance at soundcheck.

  ## What the studies report

  - **Energy beats complexity (Wichern et al., iZotope, AES 2015).** The authors studied human mixes from a multitrack dataset to derive loudness targets per instrument type, then built three automatic level-setting methods and compared them with human mixes in a listening test. Listeners preferred the mixes from the simple energy-based model, which suggests a complex psychoacoustic model may not be needed just to set levels. (Only the abstract was visible; the detailed statistics were not read.)
  - **Partial loudness and masking (Ward, Reiss, Athwal, AES 2012).** This work measures each track's loudness alone and in the presence of the others and uses the difference to set gains over time and to reduce masking. Its starting premise is that a balanced mix is one where the instruments sound about equally loud, which sets it apart from the per-instrument targets above. (Abstract only.)
  - **Faders in practice (Mansbridge, Finn, Reiss, AES 2012).** An autonomous multitrack fader control was evaluated against a human mix and an earlier automatic implementation. (Listing seen only.)
  - **A warning from a compressor study.** An automatic compressor that first equalised the loudness of all tracks scored worst in a listening test, because percussive instruments ended up too loud relative to the rest. The authors link this to the earlier fader work.

  ## So how loud should each thing be?

  The studies disagree in method, not just in detail: some treat "equal loudness" as the goal, others learn instrument-dependent targets from real mixes and find simple RMS-style measures sufficient. That is why the confidence here is "contested". Neither approach replaces the engineer's decision about what the song or the speaker needs to be on top.

  ## Using this at a show

  - Use meters or a loudness readout to get every channel into a sane starting range, then balance by ear. Do not trim everything to the same number.
  - Expect percussive and low-frequency sources to look louder on a meter than they feel in the mix; vocals and speech usually need to sit above the band.
  - Re-check balance when the audience arrives; room level changes the picture.
  - For corporate speech, automix handles level between talkers (see the automix entries); music balance is still a human call.
body_vi: |
  ## Câu hỏi đặt ra

  Nếu đo được mỗi channel đang lớn cỡ nào, liệu một chương trình có set ra được balance khởi đầu hợp lý không? Các nhà nghiên cứu đã thử với phép đo level đơn giản, với chuẩn loudness, và với mô hình psychoacoustic đầy đủ. Bài học rút ra rất hữu ích khi bạn cần một balance đầu tiên thật nhanh lúc soundcheck.

  ## Các nghiên cứu cho biết gì

  - **Năng lượng thắng sự phức tạp (Wichern et al., iZotope, AES 2015).** Nhóm tác giả phân tích các bản mix của người từ một dataset multitrack để rút ra target loudness theo từng loại nhạc cụ, rồi xây ba phương pháp tự động set level và so với bản mix của người trong một buổi nghe thử. Người nghe thích các bản mix từ mô hình energy đơn giản, gợi ý rằng không nhất thiết phải dùng mô hình psychoacoustic phức tạp chỉ để set level. (Chỉ xem được abstract; không đọc các số liệu thống kê chi tiết.)
  - **Loudness từng phần (Partial loudness) và masking (Ward, Reiss, Athwal, AES 2012).** Công trình này đo loudness của từng track khi đứng riêng và khi có các track khác, rồi lấy chênh lệch đó để set gain theo thời gian và giảm masking. Tiền đề của nó là bản mix cân bằng thì các nhạc cụ nghe lớn xấp xỉ nhau, khác với các target theo từng nhạc cụ ở trên. (Chỉ abstract.)
  - **Fader trong thực tế (Mansbridge, Finn, Reiss, AES 2012).** Một bộ điều khiển fader multitrack tự động được đánh giá so với bản mix của người và một bản triển khai tự động trước đó. (Chỉ xem được phần listing.)
  - **Cảnh báo từ một nghiên cứu về compressor.** Một compressor tự động cân bằng loudness của mọi track trước rồi mới nén bị điểm thấp nhất trong buổi nghe thử, vì các nhạc cụ percussive bị lớn quá so với phần còn lại. Các tác giả liên hệ điều này với công trình fader trước đó.

  ## Vậy mỗi thứ nên lớn cỡ nào?

  Các nghiên cứu bất đồng ở phương pháp chứ không chỉ chi tiết: có nghiên cứu coi "loudness bằng nhau" là đích, có nghiên cứu học target theo nhạc cụ từ các bản mix thật và thấy các phép đo kiểu RMS đơn giản là đủ. Vì vậy độ tin cậy ở đây là "contested". Cả hai cách đều không thay được quyết định của engineer: bài hát hay người nói cần nổi lên trên cùng ở chỗ nào.

  ## Dùng vào show thế nào

  - Dùng meter hoặc loudness readout để đưa mọi channel về vùng level khởi đầu hợp lý, rồi balance bằng tai. Đừng trim mọi thứ về cùng một con số.
  - Nguồn percussive và low-frequency nhìn trên meter thường lớn hơn cảm nhận trong mix; vocal và speech thường phải ngồi trên band.
  - Kiểm tra lại balance khi khán giả vào, vì level phòng làm bức tranh thay đổi.
  - Với speech doanh nghiệp, automix lo level giữa các người nói (xem các entry về automix); balance nhạc vẫn là quyết định của con người.

  Tóm lại, meter đưa bạn tới vạch xuất phát, còn tai bạn mới là người chốt balance.
