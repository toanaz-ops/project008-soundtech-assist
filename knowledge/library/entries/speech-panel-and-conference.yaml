summary: |
  Every open microphone adds noise and cuts gain before feedback: roughly 3 dB per doubling of the
  number of open mics. Use a speech automixer or strict mute discipline so only the active talker is
  live, and keep gating-style behaviour out of the picture unless you mean it.
summary_vi: 'Mỗi mic đang mở đều thêm noise và làm giảm gain before feedback: khoảng 3 dB mỗi lần số mic mở tăng gấp đôi. Dùng speech automixer hoặc kỷ luật mute chặt để chỉ người đang nói được mở, và đừng để hành vi kiểu gating xuất hiện trừ khi bạn chủ ý.'
body: |
  **The rule of open mics.** Dan Dugan's Model D manual defines NOM, the number of open
  microphones, and the gain limiting that goes with it: ambient gain drops about 3 dB each time the
  number of open mics doubles. With four open mics that is about -6 dB, with eight about -9 dB and with
  sixteen about -12 dB. The same arithmetic describes what happens to your margin before
  feedback if you leave all mics open at the same gain: each doubling costs about 3 dB of
  headroom and adds room noise and reverb. A panel with eight table mics all open is
  therefore a much harder job than the same room with two.

  **Option 1: a speech automixer.** The Speech System in Dugan's manual spreads the gain of a single
  open mic across the system. When someone talks, that mic rises and the others fall;
  when everyone pauses, all mics return to a medium gain. It is a gain-sharing design, not a
  gate, so the room does not "chop". Set the thresholds so ambient noise gives roughly equal gain on
  every channel, and use the weight/threshold control to compensate a loud or quiet talker. If thresholds are set
  too low the mics start to sound gated, which the manual calls undesirable. See the automix topic
  entries for how to set this up on a console; if your console has a built-in automixer, check
  the WING manual for the exact controls.

  **Option 2: manual mixing with mute discipline.** On a small panel with a competent
  operator, no automixer is needed. Only unmute a mic when its person is about to speak, and
  mute it when they finish. Ask moderators to keep to one speaker at a time; assign one
  VCA/mute group per table; and keep a spare mic muted for Q&A. Mutes are free; gain before feedback is not.

  **Mute and override.** The Model D manual describes a mute that fades all channels out
  while held (it can be remoted to the chair), an override to silence other mics momentarily, and
  a preset that restores the stored on/auto/off pattern. A chairperson's mute button is a
  simple, reliable way to stop crosstalk and coughing.

  **When not to use gain sharing.** For a sung choir or a music mix, a speech gain-sharing
  automixer will give most of the gain to the loudest voice. See `vocal-backing-and-choir`.

  **Processing per mic.** Give every mic its own HPF (around 100 Hz as a starting point), a gentle
  wide presence lift if needed (see `speech-intelligibility-sti`), and a notch only where it rings.
  Use the same pickup pattern and distance on all table mics so the automixer sees similar levels.
  Test with all talkers speaking at normal volume at their real position.

  **Common mistakes:** leaving every table mic open "just in case", setting automix thresholds so
  low that ambient noise drives gain, treating a gain-sharing automixer as a noise gate, and
  forgetting to mute pack-worn mics when a panelist leaves the table.
body_vi: |
  **Quy tắc về mic mở.** Manual Model D của Dan Dugan định nghĩa NOM, số mic đang mở, và việc giới hạn gain đi kèm: ambient gain giảm khoảng 3 dB mỗi khi số mic mở tăng gấp đôi. Với bốn mic mở là khoảng -6 dB, tám mic khoảng -9 dB và mười sáu mic khoảng -12 dB. Cùng phép tính đó mô tả điều xảy ra với biên feedback của bạn nếu để tất cả mic mở ở cùng gain: mỗi lần gấp đôi tốn khoảng 3 dB Headroom và thêm noise phòng cùng reverb. Một panel có tám mic bàn mở hết vì thế khó hơn nhiều so với cùng căn phòng đó chỉ có hai mic.

  **Phương án 1: speech automixer.** Speech System trong manual của Dugan phân bổ gain của một mic đang mở ra khắp hệ thống. Khi ai đó nói, mic đó tăng lên và các mic còn lại giảm xuống; khi mọi người ngừng, tất cả mic quay về gain trung bình. Đây là thiết kế gain-sharing, không phải gate, nên phòng không bị "chặt". Đặt Threshold sao cho ambient noise cho gain gần bằng nhau trên mọi channel, và dùng điều khiển weight/Threshold để bù cho người nói to hoặc nhỏ. Nếu Threshold đặt quá thấp, các mic bắt đầu nghe như bị gate, điều mà manual gọi là không mong muốn. Xem các mục chủ đề automix để biết cách cài đặt trên console; nếu console của bạn có automixer tích hợp, kiểm tra manual của WING để biết các điều khiển chính xác.

  **Phương án 2: mix tay với kỷ luật mute.** Với panel nhỏ và người vận hành có kinh nghiệm thì không cần automixer. Chỉ unmute mic khi người đó sắp nói, và mute khi họ xong. Nhờ người điều phối giữ mỗi lúc chỉ một người nói; gán một DCA/mute group cho mỗi bàn; và giữ một mic dự phòng ở trạng thái mute cho phần Q&A. Mute là miễn phí; gain before feedback thì không.

  **Mute và override.** Manual Model D mô tả một mute làm mọi channel fade out khi đang giữ (có thể remote đến chỗ chủ tọa), một override để tạm tắt các mic khác, và một preset khôi phục mẫu on/auto/off đã lưu. Nút mute của chủ tọa là cách đơn giản và đáng tin để chặn crosstalk và tiếng ho.

  **Khi nào không dùng gain sharing.** Với dàn hợp xướng hát hoặc một mix nhạc, speech gain-sharing automixer sẽ dồn gần hết gain cho giọng to nhất. Xem `vocal-backing-and-choir`.

  **Xử lý cho từng mic.** Cho mỗi mic một HPF riêng (khoảng 100 Hz làm điểm khởi đầu), một chút presence lift rộng và nhẹ nếu cần (xem `speech-intelligibility-sti`), và chỉ notch ở chỗ nào ring. Dùng cùng pickup pattern và khoảng cách trên mọi mic bàn để automixer thấy các level tương tự. Test với tất cả người nói ở âm lượng bình thường tại đúng vị trí thật của họ.

  **Lỗi thường gặp:** để mọi mic bàn mở "phòng khi cần", đặt Threshold automix thấp đến mức ambient noise điều khiển gain, coi gain-sharing automixer như một noise gate, và quên mute các mic đeo người khi diễn giả rời bàn.

  Tóm lại, mic nào chưa cần nói thì mute.
