summary: |
  Where a body-worn mic sits decides the tone: a chest lavalier loses the 2-4 kHz consonant band and
  gains a chesty bump, while a headset near the mouth is much closer to a handheld. Place it well
  first, then apply a small, wide fix on the desk.
summary_vi: 'Vị trí của mic đeo người quyết định tiếng: lavalier trên ngực mất dải phụ âm 2-4 kHz và thêm một bump "chesty", còn headset gần miệng thì gần với handheld hơn nhiều. Đặt cho tốt trước, rồi mới sửa nhỏ, rộng trên desk.'
body: |
  **Position decides the sound.** Shure notes that the best lavalier spot depends on the clothing
  and the needs of the production. On shirts and blouses, clip just above the breastbone and hide the
  cable under the garment; with a tie, clip above the breastbone and hide the cable behind the tie;
  on a T-shirt or sweater, use the collar and keep the mic from rubbing the neck. Rubbing and
  clothing noise are the main practical enemies of lavaliers.

  **What the chest does to the voice.** DPA's speech-intelligibility notes explain that a mic on the
  chest, and especially under the chin or under clothing, loses much of the 2-4 kHz consonant
  range. It also tends to pick up a bump around 800 Hz from the chest cavity. Headsets near the cheek
  need only a small lift at the top end and are much closer to a natural tone; forehead placement is
  described as the most neutral.

  **EQ starting points.** For a lav on the chest, DPA suggests lifting about 3-4 kHz by roughly
  5-10 dB (many DPA mics have this built in, so check the manufacturer's data before adding more).
  Then cut a few dB around 800 Hz if the voice sounds boxy or "in the chest". A dense windscreen
  dulls the highs and may need a little more lift. For a headset, expect a gentle high shelf or
  nothing. Always use a wide Q, and compare against what the voice sounds like in the room
  without the PA.

  **High-pass filter.** An HPF around 80-120 Hz removes handling noise and breath, and on a WING
  it is one click on the channel. Raise it for a female or thin voice; keep it lower for a deep
  male voice to avoid a thin tone.

  **Gain before feedback.** Body-worn mics are farther from the mouth than a handheld (especially
  at the chest), so they need more gain and feed back sooner. A headset near the mouth is much louder
  at the capsule than a chest lav, which is why headsets are easier to run loud. If a
  lavalier is the only option, a notch on the first ringing frequency and a smaller PA mix near the
  presenter are your tools.

  **Practical tips.** Check wireless RF and battery level, test with the real clothing before doors,
  and ask the presenter to turn their head: a lav on one side can drop when they turn away. Mute the
  pack when the talker leaves the stage so clothing noise and backstage chatter do not go to the
  house.

  **Common mistakes:** boosting 3-4 kHz on a headset that did not need it (it sounds harsh),
  cutting the "chest" frequency too deeply (the voice goes hollow), and forgetting that sweat,
  fabric and hair change the sound minute by minute.
body_vi: |
  **Vị trí quyết định tiếng.** Shure lưu ý vị trí lavalier tốt nhất phụ thuộc vào quần áo và nhu cầu của production. Với áo sơ mi, kẹp ngay trên xương ức và giấu dây dưới áo; với cà vạt, kẹp trên xương ức và giấu dây sau cà vạt; với áo thun hoặc áo len, dùng cổ áo và giữ mic khỏi cọ vào cổ. Tiếng cọ và tiếng quần áo là kẻ thù thực tế chính của lavalier.

  **Ngực làm gì với giọng.** Ghi chú về độ rõ lời (Speech intelligibility) của DPA giải thích rằng mic đặt trên ngực, nhất là dưới cằm hoặc dưới quần áo, mất nhiều dải phụ âm 2-4 kHz. Nó cũng có xu hướng thu một bump quanh 800 Hz từ khoang ngực. Headset gần má chỉ cần boost nhẹ ở top end và gần tiếng tự nhiên hơn nhiều; đặt ở trán được mô tả là trung tính nhất.

  **EQ khởi đầu.** Với lav trên ngực, DPA gợi ý nâng khoảng 3-4 kHz chừng 5-10 dB (nhiều mic DPA đã có sẵn việc này, nên check dữ liệu của hãng trước khi thêm, kẻo boost chồng boost). Sau đó cut vài dB quanh 800 Hz nếu giọng nghe boxy (bọng, như bị nhốt trong hộp) hoặc "trong ngực". Windscreen dày làm tối tiếng cao và có thể cần nâng thêm chút. Với headset, chỉ cần một high Shelf nhẹ hoặc không cần gì. Luôn dùng Q rộng, và so với tiếng giọng trong phòng khi không có PA.

  **High-pass filter.** HPF quanh 80-120 Hz loại bỏ handling noise và hơi thở, và trên WING chỉ cần một cú click trên channel. Nâng cao hơn cho giọng nữ hoặc giọng thin; giữ thấp hơn cho giọng nam trầm để tránh tiếng bị thin (mỏng dính như tờ giấy).

  **Gain before feedback.** Mic đeo người ở xa miệng hơn handheld (nhất là ở ngực), nên cần nhiều gain hơn và feedback (hú rít) sớm hơn. Headset gần miệng to hơn nhiều ở capsule so với lav ngực, đó là lý do headset dễ chạy to hơn. Nếu lavalier là lựa chọn duy nhất, một Notch trên tần số ring đầu tiên và PA mix nhỏ hơn gần người thuyết trình là công cụ của bạn.

  **Mẹo thực tế.** Check RF wireless và mức pin, test với quần áo thật trước giờ mở cửa, và nhờ người thuyết trình quay đầu: lav đặt một bên có thể yếu đi khi họ quay đi. Mute pack khi người nói rời stage để tiếng quần áo và chuyện trò hậu trường không ra loa.

  **Lỗi thường gặp:** boost 3-4 kHz trên headset không cần (nghe harsh), cut tần "ngực" quá sâu (giọng thành rỗng), và quên rằng mồ hôi, vải và tóc thay đổi tiếng từng phút.
