summary: On Quantum every channel has five selectable insert positions, shared by Insert A, Insert B and Mustard; each position holds only one of them. On SD, Insert A is pre-processing and Insert B post-processing.
summary_vi: Trên Quantum mỗi channel có năm vị trí insert chọn được, dùng chung cho Insert A, Insert B và Mustard; mỗi vị trí chỉ chứa một thứ. Trên SD, Insert A nằm trước xử lý còn Insert B sau xử lý.
body: |
  ## What it is (verified, reference manual PDF pp. 24, 39, 52)

  Every channel has Insert A and Insert B, following the channel's mono or stereo format. On SD, Insert A is pre-signal-processing (post filters) and Insert B is post-processing; up to 32 mono SD input channels can move Insert B post-fader. On Quantum consoles there are five selectable positions on every channel: pre-fade, mid EQ/dyn, pre-EQ/dyn, pre-processing and post-fade. These are shared between Insert A, Insert B and Mustard; one item per position, any item in any free position.

  Positions in signal order, from the Mustard page (the manual's five descriptions are matched to the names here by signal order; the page text lists them unlabelled, so this mapping is an inference, not stated directly by the manual): pre-processing is after trim and before delay/DiGiTube; pre-EQ/dyn is after filters and before EQ/dynamics; mid is between EQ and dynamics; pre-fade is after processing and before mute and fader; post-fade is after the fader. The default Mustard position is between EQ and dynamics. The Input/Trim scope includes the Mustard position.

  ## Why and how (common practice)

  Choose where outboard or a Spice Rack processor acts: pre-EQ to hit it before tone shaping, post-fade for an effect that follows the fader. Steps: open the channel's insert area, move Insert A or B to the position you want, then set Mustard to a different free position.

  Pitfall: if Mustard will not go where you want, an insert is occupying it; move that insert first.

  ## What is NOT verified

  - The exact on-screen control for moving an insert position (the manual says "as with aux nodes" without describing the button).
  - How inserts behave when a session file is moved between SD and Quantum.
body_vi: |
  ## Nó là gì (đã xác minh, reference manual PDF tr. 24, 39, 52)

  Mỗi channel có Insert A và Insert B, theo định dạng mono hoặc stereo của channel. Trên SD, Insert A nằm trước xử lý tín hiệu (sau các filter) còn Insert B nằm sau xử lý; tối đa 32 input channel mono của SD chuyển được Insert B sang post-fader. Trên Quantum, mỗi channel có năm vị trí chọn được: pre-fade, mid EQ/dyn, pre-EQ/dyn, pre-processing và post-fade. Chúng dùng chung cho Insert A, Insert B và Mustard; mỗi vị trí một thứ, thứ nào cũng đặt được vào vị trí còn trống.

  Thứ tự tín hiệu, theo trang Mustard (năm mô tả trong manual được ghép với tên theo thứ tự tín hiệu; text của trang liệt kê chúng không gắn nhãn, nên đây là suy luận, manual không nói thẳng): pre-processing là sau trim và trước delay/DiGiTube; pre-EQ/dyn là sau filter và trước EQ/dynamics; mid là giữa EQ và dynamics; pre-fade là sau xử lý và trước mute và fader; post-fade là sau fader. Vị trí mặc định của Mustard là giữa EQ và dynamics. Scope Input/Trim bao gồm vị trí Mustard.

  ## Vì sao và cách dùng (kinh nghiệm thông thường)

  Chọn chỗ đồ outboard hoặc processor Spice Rack tác động: pre-EQ để đánh trước khi tạo tone, post-fade cho effect chạy theo fader. Các bước: mở vùng insert của channel, chuyển Insert A hoặc B tới vị trí bạn muốn, rồi đặt Mustard ở vị trí trống khác.

  Bẫy thường gặp: nếu Mustard không đặt được chỗ bạn muốn thì đang có insert chiếm; hãy chuyển insert đó trước.

  ## Điều CHƯA được xác minh

  - Điều khiển trên màn hình để chuyển vị trí insert (manual chỉ ghi "as with aux nodes" mà không mô tả nút).
  - Insert hoạt động thế nào khi chuyển file session giữa SD và Quantum.
