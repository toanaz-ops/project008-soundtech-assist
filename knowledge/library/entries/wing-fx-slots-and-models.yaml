id: wing-fx-slots-and-models
title: "WING FX slots, reverb bus setup and model ranges (partly unverified)"
title_vi: "Slot FX của WING, cách dựng bus reverb và dải thông số (một phần chưa xác minh)"
topic: wing-console
tags:
  instrument: []
  genre: []
