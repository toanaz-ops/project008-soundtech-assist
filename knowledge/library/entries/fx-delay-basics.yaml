summary: Delay adds size without pushing a source back the way reverb does. Learn the tempo formula, the slapback window, how feedback and filtering shape repeats, and how an automated send makes a throw.
summary_vi: Delay thêm độ lớn mà không đẩy nguồn lùi ra xa như reverb. Nắm công thức tempo, khoảng slapback, cách feedback và filter định hình các repeat, và cách một send được automate tạo ra throw.
body: |
  ## Why delay instead of reverb

  A delay places support behind the dry sound without washing it into the distance, so a lead vocal can feel bigger and stay clear. In a room that is already reverberant, delay is often the safer effect.

  ## Tempo-synced delay

  Delay time in milliseconds for a quarter note is 60000 divided by the tempo in BPM. At 120 BPM that is 500 ms; at 90 BPM about 667 ms. A dotted eighth is three quarters of that (375 ms at 120 BPM), and an eighth is half. The diagram plots the quarter note and dotted eighth against tempo. This is plain arithmetic, not an opinion. On a WING you can usually type a time or set a note value from the song's tempo; tap-tempo from the drummer's click or the playback tempo gets you to the same place.

  Pick a time that sits in the gaps of the lyric. SOS suggests starting with a quarter-note mono delay, avoiding very short times, and feeding it from an aux send at 100% wet. Raise the send until the delay is audible in context, then back off a little.

  ## Slapback

  Slapback is one short repeat, no feedback. SOS gives roughly 80 to 150 ms and notes it is usually not tempo-synced and can sound odd soloed, so judge it in the full mix. Another SOS article describes a similar tape-style range. It thickens a vocal or guitar and makes it less exposed.

  ## Feedback and filtering the repeats

  Feedback sends part of the output back in for more repeats. It must stay below unity or the echoes grow instead of fading. Three or four repeats is often enough. Put a low-pass filter in the feedback loop or on the delay return so each repeat gets darker; darker repeats sit back and sound more musical. High-pass the delay too, to keep low-mid mud out of the mix.

  ## Throws

  A throw is a delay that appears only on selected words. Raise the delay send just before the phrase ends and drop it right after. SOS describes automating the send for exactly this. Live, ride the send by fader or a momentary switch on the WING; done on the last word of a line it adds drama without cluttering the rest.

  ## Mistakes to avoid

  - Delay time that fights the groove: re-sync when the tempo changes. SOS notes synced delays can hiccup on tempo changes.
  - Long feedback that never decays: a runaway echo in a quiet room is hard to stop. Keep a hand on the return.
  - Unfiltered repeats that stack with the dry vocal and blur lyrics.

  All numbers are starting points, to be set by ear against the song.
body_vi: |
  ## Vì sao dùng delay thay vì reverb

  Delay đặt phần hỗ trợ phía sau âm khô mà không nhòe nó vào xa, nên lead vocal có thể nghe to hơn mà vẫn rõ. Trong phòng vốn đã nhiều vang, delay thường là effect an toàn hơn.

  ## Delay đồng bộ tempo

  Thời gian delay tính bằng ms cho một nốt đen (quarter note) là 60000 chia cho tempo tính bằng BPM. Ở 120 BPM là 500 ms; ở 90 BPM khoảng 667 ms. Nốt móc đơn chấm dôi (dotted eighth) bằng ba phần tư giá trị đó (375 ms ở 120 BPM), và nốt móc đơn (eighth) bằng một nửa. Biểu đồ vẽ quarter note và dotted eighth theo tempo. Đây là số học thuần túy, không phải ý kiến. Trên WING thường có thể gõ trực tiếp thời gian hoặc chọn note value theo tempo bài; tap tempo từ click của tay trống hoặc tempo playback cũng ra cùng kết quả.

  Chọn thời gian nằm vào các khoảng hở của lời hát. SOS gợi ý bắt đầu với mono delay quarter note, tránh thời gian quá ngắn, và cấp từ một aux send ở 100% wet. Nâng send lên tới khi nghe thấy delay trong ngữ cảnh mix, rồi lùi lại một chút.

  ## Slapback

  Slapback là một repeat ngắn, không feedback. SOS đưa ra khoảng 80 đến 150 ms và lưu ý nó thường không đồng bộ tempo và có thể nghe lạ khi solo, nên phải đánh giá trong full mix. Một bài SOS khác mô tả khoảng tương tự kiểu tape. Nó làm dày vocal hoặc guitar và bớt trơ trọi.

  ## Feedback và lọc các repeat

  Hồi tiếp (Feedback) đưa một phần output quay lại vào để có thêm repeat. Nó bắt buộc phải nằm dưới unity, nếu không tiếng vang sẽ lớn dần thay vì tắt. Ba hay bốn repeat thường là đủ. Đặt low-pass filter trong vòng Feedback hoặc trên return của delay để mỗi repeat tối dần; repeat tối thì lùi ra sau và nghe nhạc tính hơn. High-pass delay luôn để giữ low-mid mud khỏi mix.

  ## Throw

  Throw là delay chỉ xuất hiện ở những từ được chọn. Nâng delay send ngay trước khi câu kết thúc và hạ xuống ngay sau đó. SOS mô tả việc automate send đúng cho mục đích này. Khi live, ride send bằng fader hoặc một nút nhấn tạm thời (momentary) trên WING; làm ở từ cuối của một câu sẽ thêm kịch tính mà không làm rối phần còn lại.

  ## Lỗi cần tránh

  - Thời gian delay đánh nhau với groove: sync lại khi tempo đổi. SOS lưu ý delay đã sync có thể bị khựng khi tempo đổi.
  - Feedback dài không bao giờ tắt: tiếng vang chạy mất kiểm soát trong phòng yên tĩnh rất khó dừng. Luôn để tay gần return.
  - Repeat không lọc chồng lên vocal khô và làm nhòe lời.

  Tóm lại, mọi con số chỉ là điểm xuất phát, chỉnh bằng tai theo bài.
