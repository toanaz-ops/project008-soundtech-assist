summary: "Delay adds size without pushing a source back the way reverb does. Learn the tempo formula, the slapback window, how feedback and filtering shape repeats, and how an automated send makes a throw."
body: |
  ## Why delay instead of reverb

  A delay places support behind the dry sound without washing it into the distance, so a lead vocal can feel bigger and stay clear. In a room that is already reverberant, delay is often the safer effect.

  ## Tempo-synced delay

  Delay time in milliseconds for a quarter note is 60000 divided by the tempo in BPM. At 120 BPM that is 500 ms; at 90 BPM about 667 ms. A dotted eighth is three quarters of that (375 ms at 120 BPM), and an eighth is half. The diagram plots the quarter note and dotted eighth against tempo. This is plain arithmetic, not an opinion. On a WING you can usually type a time or set a note value from the song's tempo; tap-tempo from the drummer's click or the playback tempo gets you to the same place.

  Pick a time that sits in the gaps of the lyric. SOS suggests starting with a quarter-note mono delay, avoiding very short times, and feeding it from an aux send at 100% wet. Raise the send until the delay is audible in context, then back off a little.

  ## Slapback

  Slapback is one short repeat, no feedback. SOS gives roughly 80 to 150 ms and notes it is usually not tempo-synced and can sound odd soloed, so judge it in the full mix. Another SOS article describes a similar tape-style range. It thickens a vocal or guitar and makes it less exposed.

  ## Feedback and filtering the repeats

  Feedback sends part of the output back in for more repeats. It must stay below unity or the echoes grow instead of fading. Three or four repeats is often enough. Put a low-pass filter in the feedback loop or on the delay return so each repeat gets darker; darker repeats sit back and sound more musical. High-pass the delay too, to keep low-mid mud out of the mix.

  ## Throws

  A throw is a delay that appears only on selected words. Raise the delay send just before the phrase ends and drop it right after. SOS describes automating the send for exactly this. Live, ride the send by fader or a momentary switch on the WING; done on the last word of a line it adds drama without cluttering the rest.

  ## Mistakes to avoid

  - Delay time that fights the groove: re-sync when the tempo changes. SOS notes synced delays can hiccup on tempo changes.
  - Long feedback that never decays: a runaway echo in a quiet room is hard to stop. Keep a hand on the return.
  - Unfiltered repeats that stack with the dry vocal and blur lyrics.

  All numbers are starting points, to be set by ear against the song.
rule:
  applies_to:
    source_type: [vocal.lead, guitar]
  params:
    slapback_ms: [80, 150]
    repeats: [3, 4]
  notes: "Quarter note ms = 60000 / BPM (arithmetic). Slapback window from SOS; repeats count is a starting point, adjust by ear."
