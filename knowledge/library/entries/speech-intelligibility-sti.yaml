summary: |
  STI is a 0-1 score of how well a system preserves the fast level changes in speech. Reverberation and
  noise lower it; the consonant region around 2-4 kHz carries most of what listeners need to
  understand words.
body: |
  **What STI measures.** The Speech Transmission Index asks how much of the speech's
  slow loudness modulation survives between talker and listener. A perfect path scores 1; noise,
  reverberation, echoes, distortion and bad loudspeaker coverage all reduce the score. IEC
  60268-16 defines the method; the full version uses seven octave bands from 125 Hz to 8 kHz and
  14 modulation frequencies per band, and STIPA is a faster test with a special signal
  (about 15 seconds). Rational Acoustics' Smaart can calculate STI from an impulse response or
  STIPA, so you can measure at a few seats instead of guessing.

  **How to read a number.** Rational Acoustics' summary of the rating scale: above about 0.76 is
  recording-studio quality; 0.66-0.76 suits theatres, auditoria and teleconferencing; 0.54-0.66
  covers classrooms, churches and offices; 0.42-0.54 is difficult spaces; below 0.42 is not
  suitable for PA speech. These bands are guidance, not a pass mark for your event: a ballroom
  with an STI near 0.55 can still work if mics are close and the room is not too reverberant.

  **Where the words live.** DPA's notes separate vowels (carrying pitch and body, fading fast above
  about 1 kHz) from consonants (mostly above 500 Hz and most concentrated in 2-4 kHz). Removing
  everything under 500 Hz costs only about 5 percent of intelligibility, but low-passing at
  1 kHz can drop it below 40 percent. That is why a "big, bassy" speech sound can still be
  unintelligible, and why boosting the low end does nothing for clarity.

  **What hurts it:**

  - **Reverberation.** Long decay smears consonants into the next syllable; direct sound from
    well-aimed loudspeakers close to listeners is the fix, not more level.
  - **Noise.** HVAC, crowd noise, music under dialogue. Rational Acoustics suggests a signal-to-noise
    ratio of about 15 dB or better as ideal, with playback level roughly 60-80 dBA at the seat.
  - **Mic position and filtering.** Chest and under-chin lavaliers lose the 2-4 kHz band (see
    `speech-headset-and-lavalier`); removing highs with EQ or a dull windscreen does the same.
  - **Shouting** does not help much because consonants cannot rise to match vowels.

  **Practical workflow at a corporate event.** Choose mics that stay close to mouths, aim
  loudspeakers at the audience (not at walls), keep music beds at least about 15 dB below speech
  (see `speech-playback-and-walk-in-music`), use a small wide lift in the 2-4 kHz region only if
  the voice needs it, and walk the room during rehearsal. If the venue's STI matters
  (emergency announcement, regulations), measure; do not claim a figure you did not measure.

  **Common mistakes:** turning up the level in a reverberant room (it raises the reverb with
  it), cutting the 2-4 kHz band to avoid harshness without checking intelligibility, and
  confusing loudness with clarity.
