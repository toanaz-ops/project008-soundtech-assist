summary: |
  STI is a 0-1 score of how well a system preserves the fast level changes in speech. Reverberation and
  noise lower it; the consonant region around 2-4 kHz carries most of what listeners need to
  understand words.
summary_vi: STI là điểm số 0-1 cho biết hệ thống giữ lại tốt đến đâu các biến thiên level nhanh của tiếng nói. Reverberation và noise làm điểm giảm; vùng phụ âm quanh 2-4 kHz mang phần lớn thứ người nghe cần để hiểu từ.
body: |
  **What STI measures.** The Speech Transmission Index asks how much of the speech's
  slow loudness modulation survives between talker and listener. A perfect path scores 1; noise,
  reverberation, echoes, distortion and bad loudspeaker coverage all reduce the score. IEC
  60268-16 defines the method; the full version uses seven octave bands from 125 Hz to 8 kHz and
  14 modulation frequencies per band, and STIPA is a faster test with a special signal
  (about 15 seconds). Rational Acoustics' Smaart can calculate STI from an impulse response or
  STIPA, so you can measure at a few seats instead of guessing.

  **How to read a number.** Rational Acoustics' summary of the rating scale: above about 0.76 is
  recording-studio quality; 0.66-0.76 suits theatres, auditoria and teleconferencing; 0.54-0.66
  covers classrooms, churches and offices; 0.42-0.54 is difficult spaces; below 0.42 is not
  suitable for PA speech. These bands are guidance, not a pass mark for your event: a ballroom
  with an STI near 0.55 can still work if mics are close and the room is not too reverberant.

  **Where the words live.** DPA's notes separate vowels (carrying pitch and body, fading fast above
  about 1 kHz) from consonants (mostly above 500 Hz and most concentrated in 2-4 kHz). Removing
  everything under 500 Hz costs only about 5 percent of intelligibility, but low-passing at
  1 kHz can drop it below 40 percent. That is why a "big, bassy" speech sound can still be
  unintelligible, and why boosting the low end does nothing for clarity.

  **What hurts it:**

  - **Reverberation.** Long decay smears consonants into the next syllable; direct sound from
    well-aimed loudspeakers close to listeners is the fix, not more level.
  - **Noise.** HVAC, crowd noise, music under dialogue. Rational Acoustics suggests a signal-to-noise
    ratio of about 15 dB or better as ideal, with playback level roughly 60-80 dBA at the seat.
  - **Mic position and filtering.** Chest and under-chin lavaliers lose the 2-4 kHz band (see
    `speech-headset-and-lavalier`); removing highs with EQ or a dull windscreen does the same.
  - **Shouting** does not help much because consonants cannot rise to match vowels.

  **Practical workflow at a corporate event.** Choose mics that stay close to mouths, aim
  loudspeakers at the audience (not at walls), keep music beds at least about 15 dB below speech
  (see `speech-playback-and-walk-in-music`), use a small wide lift in the 2-4 kHz region only if
  the voice needs it, and walk the room during rehearsal. If the venue's STI matters
  (emergency announcement, regulations), measure; do not claim a figure you did not measure.

  **Common mistakes:** turning up the level in a reverberant room (it raises the reverb with
  it), cutting the 2-4 kHz band to avoid harshness without checking intelligibility, and
  confusing loudness with clarity.
body_vi: |
  **STI đo cái gì.** Chỉ số truyền đạt tiếng nói (Speech Transmission Index, STI) hỏi: bao nhiêu phần của sự điều biến độ lớn chậm trong tiếng nói còn sống sót giữa người nói và người nghe. Một đường truyền hoàn hảo được 1; noise, reverberation, echo, distortion và phủ loa kém đều làm điểm giảm. IEC 60268-16 định nghĩa phương pháp; bản đầy đủ dùng bảy octave band từ 125 Hz đến 8 kHz và 14 tần số điều biến cho mỗi band, còn STIPA là bài test nhanh hơn với một tín hiệu đặc biệt (khoảng 15 giây). Smaart của Rational Acoustics tính được STI từ impulse response hoặc STIPA, nên bạn đo được ở vài ghế thay vì đoán.

  **Đọc một con số thế nào.** Tóm tắt thang đánh giá của Rational Acoustics: trên khoảng 0.76 là chất lượng phòng thu; 0.66-0.76 hợp với nhà hát, auditorium và teleconferencing; 0.54-0.66 là lớp học, nhà thờ và văn phòng; 0.42-0.54 là không gian khó; dưới 0.42 không phù hợp cho PA speech. Các khoảng này chỉ là hướng dẫn, không phải điểm đỗ cho sự kiện của bạn: một ballroom có STI gần 0.55 vẫn có thể chạy tốt nếu mic ở gần miệng và phòng không quá nhiều vang.

  **Lời nằm ở đâu.** Ghi chú của DPA tách nguyên âm (mang cao độ và body (thân tiếng), tắt nhanh trên khoảng 1 kHz) khỏi phụ âm (chủ yếu trên 500 Hz và tập trung nhất ở 2-4 kHz). Bỏ hết mọi thứ dưới 500 Hz chỉ mất khoảng 5 phần trăm độ dễ hiểu, nhưng low-pass ở 1 kHz có thể kéo nó xuống dưới 40 phần trăm. Vì vậy tiếng nói "to, dày bass" vẫn có thể không nghe ra chữ, và boost low end chẳng giúp gì cho độ rõ.

  **Cái gì làm hỏng nó:**

  - **Reverberation.** Decay dài làm phụ âm nhòe sang âm tiết kế tiếp; cách xử lý là direct sound từ loa hướng đúng và đặt gần người nghe, không phải thêm level.
  - **Noise.** HVAC, tiếng đám đông, nhạc nền dưới lời thoại. Rational Acoustics gợi ý tỉ lệ signal-to-noise khoảng 15 dB hoặc tốt hơn là lý tưởng, với mức playback khoảng 60-80 dBA tại ghế.
  - **Vị trí mic và filtering.** Lavalier gắn ngực và dưới cằm mất dải 2-4 kHz (xem `speech-headset-and-lavalier`); cắt bớt phần cao bằng EQ hoặc dùng windscreen dày cũng gây tác hại tương tự.
  - **Hét to** không giúp được mấy vì phụ âm không thể tăng theo kịp nguyên âm.

  **Quy trình thực tế ở sự kiện doanh nghiệp.** Chọn mic ở gần miệng, hướng loa vào khán giả (không hướng vào tường), giữ nhạc nền thấp hơn tiếng nói ít nhất khoảng 15 dB (xem `speech-playback-and-walk-in-music`), chỉ dùng một cú nâng rộng nhỏ ở vùng 2-4 kHz khi giọng cần, và đi bộ quanh phòng lúc rehearsal. Nếu STI của venue quan trọng (thông báo khẩn cấp, quy định), hãy đo; đừng khai một con số bạn chưa đo.

  **Lỗi thường gặp:** vặn to level trong phòng nhiều vang (reverb to theo cùng), cut dải 2-4 kHz để tránh harshness (độ gắt) mà không kiểm tra độ rõ lời, và nhầm độ lớn với độ rõ.
