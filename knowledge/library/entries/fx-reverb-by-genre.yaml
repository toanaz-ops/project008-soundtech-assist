  kind: reverb_genre
  applies_to: {source_type: [vocal.lead, drums.snare], genre: [pop, rock, ballad, jazz, edm, bolero, speech]}
  params:
    return_filter_defaults: {locut_hz: [100, 300], hicut_hz: [6000, 8000]}
    by_genre:
      pop: {decay_s: [0.8, 1.8], predelay_ms: [20, 80], locut_hz: 150, hicut_hz: 7000, type: "plate (vocal), short room or plate (drums)"}
      rock: {decay_s: [0.3, 1.2], predelay_ms: [0, 30], locut_hz: 200, hicut_hz: 7000, type: "short room (drums), plate (vocal)"}
      ballad: {decay_s: [1.8, 3.5], predelay_ms: [40, 100], locut_hz: 150, hicut_hz: 6500, type: "plate or hall"}
      jazz: {decay_s: [1.0, 2.2], predelay_ms: [15, 40], locut_hz: 120, hicut_hz: 8000, type: "room or chamber"}
      edm: {decay_s: [0.8, 2.5], predelay_ms: [10, 60], locut_hz: 250, hicut_hz: 6000, type: "short on drums, larger tail on vocal"}
      bolero: {decay_s: [1.8, 3.0], predelay_ms: [20, 60], locut_hz: 150, hicut_hz: 8000, type: "hall or plate (ballad profile)"}
      speech: {decay_s: [0.0, 0.6], predelay_ms: [10, 30], locut_hz: 250, hicut_hz: 6000, type: "off or very short room"}
  notes: "Per-genre values are a synthesis (low confidence). Jazz, EDM, bolero and speech rows have no direct source. Adjust by ear."
