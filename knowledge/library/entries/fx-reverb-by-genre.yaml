summary: General reverb rules from published guidance (faster music wants shorter decay, pre-delay keeps a vocal in front, filter the return), turned into a per-genre table of decay, pre-delay and return filtering. The per-genre numbers are a synthesis and low confidence.
summary_vi: Các nguyên tắc reverb chung từ tài liệu đã xuất bản (nhạc nhanh cần Decay ngắn hơn, pre-delay giữ vocal ở phía trước, filter phần return), chuyển thành bảng theo genre gồm Decay, pre-delay và filter cho return. Các con số theo genre là tổng hợp và có độ tin cậy thấp.
body: |
  ## What the sources agree on

  The published guidance is qualitative and consistent: the busier and faster the song, the shorter the reverb should be; a sparse, slow song can carry a long tail. Pre-delay (the gap before the reverb starts) keeps a vocal articulate: a few milliseconds suit a short ambience, while a long reverb usually wants roughly 30 to 70 ms. One vendor article gives wider windows per source (vocals about 20 to 80 ms, drums about 5 to 50 ms, guitars about 40 to 100 ms), and a magazine article notes that lead vocals can go past 100 ms. Decay depends on the algorithm: ambience patches run a fraction of a second, halls and churches run several seconds. A ballad vocal can take a layered 3 to 4 s reverb.

  Return handling is the part people forget. Filter the low end of the return, roughly 100 to 300 Hz, and roll off the top from about 7 kHz so the tail does not add mud or hiss. Run the reverb as an aux return at 100 percent wet, fed by post-fader sends, so the amount follows the fader.

  ## The per-genre table (starting points, low confidence)

  The table in the rule block is a synthesis of that general guidance, not a measured result. Treat every figure as a starting point you adjust by ear in the room.

  - **Pop**: plate on the vocal, short room or plate on drums; decay roughly 0.8 to 1.8 s, pre-delay 20 to 80 ms.
  - **Rock**: short room or ambience on drums, a plate on the vocal; decay 0.3 to 1.2 s, little or no pre-delay on the drums (a magazine source says short or no pre-delay suits rock drums).
  - **Ballad**: plate or hall; decay 1.8 to 3.5 s, pre-delay 40 to 100 ms.
  - **Jazz**: room or chamber; decay 1.0 to 2.2 s. No jazz-specific source was found, so this is inferred from advice about natural spaces.
  - **EDM**: short reverb on drums, a larger tail on the vocal; decay 0.8 to 2.5 s. No source; the only hint is that dry modern styles lean on delay.
  - **Bolero**: treated like a ballad. No reputable source for this genre was found; it is an extrapolation.
  - **Speech**: off or a very short room. This is a product choice, intelligibility first; one source notes long tails reduce a vocal's prominence.

  ## Where sources disagree

  Vocal pre-delay: one article says 100 ms or more, another 20 to 80 ms, a third 30 to 70 ms. The table uses 20 to 80 ms and widens it for ballads.

  ## Limits

  No source gives live-sound figures per genre, and the bolero and speech rows have no citation at all. The numbers above are for a first pass at soundcheck.
body_vi: |
  ## Các nguồn đồng ý với nhau ở điểm nào

  Hướng dẫn đã xuất bản mang tính định tính và nhất quán: bài càng bận rộn và nhanh thì reverb càng nên ngắn; bài thưa và chậm có thể mang đuôi dài. Pre-delay (khoảng trễ trước khi reverb bắt đầu) giữ cho vocal rõ chữ: vài mili giây hợp với ambience ngắn, còn reverb dài thường cần khoảng 30 đến 70 ms. Một bài của hãng cho cửa sổ rộng hơn theo từng nguồn (vocal khoảng 20 đến 80 ms, drum khoảng 5 đến 50 ms, guitar khoảng 40 đến 100 ms), và một bài trên tạp chí ghi chú rằng lead vocal có thể vượt quá 100 ms. Thời gian tàn (Decay) phụ thuộc vào algorithm: patch ambience chỉ một phần của giây, hall và church kéo dài vài giây. Vocal ballad có thể dùng reverb nhiều lớp 3 đến 4 s.

  Xử lý return là phần dân nghề hay quên. Filter phần low end của return, khoảng 100 đến 300 Hz, và roll off phần top từ khoảng 7 kHz để đuôi không thêm mud hay hiss. Chạy reverb như một aux return ở 100 phần trăm wet, lấy từ các send post-fader, để lượng reverb đi theo fader.

  ## Bảng theo genre (điểm khởi đầu, độ tin cậy thấp)

  Bảng trong khối rule là tổng hợp từ hướng dẫn chung đó, không phải kết quả đo. Coi mọi con số là điểm khởi đầu để chỉnh bằng tai trong phòng.

  - **Pop**: plate trên vocal, room ngắn hoặc plate trên drum; Decay khoảng 0.8 đến 1.8 s, pre-delay 20 đến 80 ms.
  - **Rock**: room ngắn hoặc ambience trên drum, plate trên vocal; Decay 0.3 đến 1.2 s, pre-delay rất ít hoặc không có trên drum (một nguồn tạp chí nói pre-delay ngắn hoặc không có hợp với drum rock).
  - **Ballad**: plate hoặc hall; Decay 1.8 đến 3.5 s, pre-delay 40 đến 100 ms.
  - **Jazz**: room hoặc chamber; Decay 1.0 đến 2.2 s. Không tìm được nguồn riêng cho jazz, nên đây là suy ra từ lời khuyên về không gian tự nhiên.
  - **EDM**: reverb ngắn trên drum, đuôi lớn hơn trên vocal; Decay 0.8 đến 2.5 s. Không có nguồn; gợi ý duy nhất là các phong cách hiện đại khô hay dựa vào delay.
  - **Bolero**: xử lý như ballad. Không tìm được nguồn uy tín cho genre này; đây là ngoại suy.
  - **Speech**: tắt hoặc một room rất ngắn. Đây là lựa chọn của sản phẩm, ưu tiên độ rõ lời (intelligibility); một nguồn ghi chú đuôi dài làm vocal bớt nổi.

  ## Chỗ các nguồn bất đồng

  Pre-delay của vocal: một bài nói 100 ms trở lên, bài khác nói 20 đến 80 ms, bài thứ ba nói 30 đến 70 ms. Bảng dùng 20 đến 80 ms và nới rộng cho ballad.

  ## Giới hạn

  Không nguồn nào đưa số liệu live-sound theo từng genre, và các hàng bolero và speech hoàn toàn không có trích dẫn. Các con số trên chỉ dùng cho lượt chỉnh đầu tiên lúc soundcheck.
