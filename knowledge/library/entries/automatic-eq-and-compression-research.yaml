title: "Automatic EQ and compression research"
title_vi: "Nghiên cứu EQ và compressor tự động"
topic: automix
tags:
  instrument: [multitrack]
  genre: [rock, pop, folk]
  technique: [automatic-eq, automatic-compression, masking]
  event: [concert]
summary: "Research systems set EQ to reduce masking between tracks and set compressor ratio, threshold, knee, attack and release from the signal's own features. In one test the automatic compression matched or beat semi-professional manual mixes, but the evidence is small and studio-based."
body: |
  ## Automatic EQ

  The multitrack EQ work by Hafezi and Reiss defines a simplified measure of masking (one track hiding another in the same frequency region) and cuts or boosts tracks to reduce it. Four versions were built: two offline (fully automatic and semi-automatic, applying a constant EQ from average masking) and two real-time. In listening tests the automatic versions reduced both measured and perceived masking, and the semi-automatic offline version, with a single user control, improved a raw mix more than an amateur did and came close to a professional. The authors also found that existing objective masking measures predict perceived masking poorly for multitrack music, so be cautious of any tool that claims to "measure" masking exactly. (Only the abstract was visible.)

  ## Automatic compression

  Ma and colleagues (JAES 2015) configured every compressor parameter from side-chain features. The design rests on six working assumptions that are also good rules of thumb:

  - signals with large level swings get more compression;
  - signals with more low-frequency energy get more compression;
  - attack and release follow how transient the signal is: percussive material wants shorter times;
  - knee width follows the amount of compression;
  - make-up gain should restore the input loudness;
  - there is a ceiling to useful compression that depends on the source.

  In a method-of-adjustment test, 15 engineers set ratio and threshold on four songs. The averaged ratios were modest (read off the paper's figure: mostly between roughly 1.5:1 and 3:1) and the spread between engineers was smaller than expected, though differences between instruments were clear. The paper quotes usual ranges for attack of 5 to 250 ms and release of 5 to 3000 ms. The final system used a maximum attack of 80 ms and a maximum release of 1000 ms before scaling by crest factor. In the listening test (16 participants, six songs) the automatic mixes rated best for appropriate amount of compression and for overall preference, and were close to the better human mix on stabilising levels.

  ## What to take from it

  - Moderate ratios are enough most of the time; the experiment's engineers did not choose heavy compression.
  - Choose time constants by how percussive the source is, not by a single "vocal" or "drum" preset.
  - Compare compressed and bypassed at equal loudness; the paper notes that a compressor with automatic make-up gain can fool you with loudness changes.
  - Caveats: 15 and 16 participants, half from one research group, studio multitracks and 20-second excerpts. Live rooms add bleed and feedback that these tests did not.
