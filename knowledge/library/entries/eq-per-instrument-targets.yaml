  params:
    by_source:
      drums.kick: {hpf_hz: [25, 60], cut_hz: [[200, 500], 180], boost_hz: [[60, 90], [1000, 5000]]}
      drums.snare: {hpf_hz: [80, 200], cut_hz: [[400, 700], [900, 1500]], boost_hz: [[150, 250], [2000, 3500]]}
      drums.tom: {hpf_hz: [40, 100], cut_hz: [[250, 250]], boost_hz: [[60, 120], [800, 1500]]}
      drums.hihat: {hpf_hz: [150, 500], cut_hz: [[3000, 7000]], boost_hz: [[12000, 12000]]}
      drums.overhead: {hpf_hz: [150, 500], cut_hz: [[4000, 4000]], boost_hz: [[8000, 12000]]}
      instrument.bass: {hpf_hz: [30, 45], cut_hz: [[200, 400]], boost_hz: [[220, 300], [800, 1000]]}
      instrument.guitar.electric: {hpf_hz: [80, 120], cut_hz: [[200, 300], [3000, 6000]], boost_hz: [[4000, 4000]]}
      instrument.guitar.acoustic: {hpf_hz: [60, 100], cut_hz: [[150, 400]], boost_hz: [[1500, 1500], [8000, 12000]]}
      instrument.keys: {hpf_hz: [40, 100], cut_hz: [[200, 500], [2000, 4000]], boost_hz: []}
      instrument.strings: {hpf_hz: [100, 150], cut_hz: [[200, 500], [1000, 4000]], boost_hz: [[10000, 10000]]}
      instrument.horns: {hpf_hz: [100, 200], cut_hz: [[500, 800], [1000, 5000]], boost_hz: [[5000, 5000]]}
      speech.vocal: {hpf_hz: [80, 150], cut_hz: [[200, 500], [500, 1200], [5000, 8000]], boost_hz: [[3000, 4000], [1000, 1500]]}
      speech.mc: {hpf_hz: [80, 150], cut_hz: [[200, 500], [5000, 8000]], boost_hz: [[1000, 1500]]}
  notes: "Regions, not gains. Keys high-pass, playback and lectern rows have no source. Starting points; adjust by ear."
