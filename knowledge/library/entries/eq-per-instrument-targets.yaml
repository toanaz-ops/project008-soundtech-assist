summary: One table of high-pass corners, cut regions and boost regions for the common live sources, gathered from vendor and magazine articles. Most sources give regions, not decibel amounts, so the dB column is mostly empty on purpose.
summary_vi: Một bảng gồm high-pass corner, vùng cần cut và vùng cần boost cho các nguồn live phổ biến, tổng hợp từ bài của hãng và tạp chí. Hầu hết nguồn chỉ nêu vùng, không nêu số dB, nên cột dB cố ý để trống gần hết.
body: |
  ## How to read the table

  The sources rarely give gain or Q. They name a region and a reason ("boxy", "papery", "presence"). The rule block records the regions and leaves decibel amounts out unless a source gave one. Cut narrow regions that sound bad, boost broad regions that sound good, and make every move by ear. The ranges below are starting points.

  ## Drums

  - **Kick**: high-pass roughly 25 to 60 Hz (35 Hz typical). Cut 200 to 500 Hz for boxiness; a dip near 180 Hz helps the bass sit. Boost 60 to 90 Hz for punch and 1 to 5 kHz (about 3 to 4 kHz) for beater click. Avoid boosting the sub below about 40 Hz live.
  - **Snare**: high-pass 80 to 200 Hz. Cut 400 to 700 Hz for ring and 900 to 1500 Hz if it sounds papery. Boost 150 to 250 Hz for body, 2 to 3.5 kHz for snap, a shelf near 8 kHz for crack. The 2 to 4 kHz zone competes with vocal presence.
  - **Toms**: high-pass about 40 to 100 Hz (exact numbers unconfirmed). Cut near 250 Hz for mud; boost 60 to 120 Hz for body and 800 to 1500 Hz for attack.
  - **Hi-hat and ride**: high-pass 150 to 500 Hz (the two sources disagree on how hard). Cut 3 to 7 kHz if harsh; a shelf near 10 to 12 kHz adds sheen.
  - **Overheads**: high-pass 150 to 500 Hz, a broad cut near 4 kHz if harsh, a shelf at 8 to 12 kHz for shimmer.

  ## Bass and guitars

  - **Bass**: high-pass roughly 30 to 45 Hz (this range is the lane's convention, not a sourced figure). Cut 200 to 400 Hz for mud; boost 220 to 300 Hz for character and 800 Hz to 1 kHz for articulation.
  - **Electric guitar**: high-pass 80 to 120 Hz. Cut 200 to 300 Hz for tubbiness and 3 to 6 kHz for fizz; a broad boost near 4 kHz adds presence (one source suggests +3 dB). Do not scoop the mids live, the core is 300 Hz to 1.5 kHz.
  - **Acoustic guitar**: high-pass 60 to 100 Hz. Cut 150 to 400 Hz if tubby; boost near 1.5 kHz for presence and a shelf at 8 to 12 kHz for air. Feedback prone at 100 to 250 Hz, so prefer cuts.

  ## Keys, strings, horns

  - **Keys**: cut 200 to 500 Hz for mud and 2 to 4 kHz to leave room for the vocal. The high-pass (40 to 100 Hz) has no source.
  - **Strings**: high-pass 100 to 150 Hz; cut 200 to 500 Hz for mud and 1 to 4 kHz for harshness; shelf near 10 kHz for air.
  - **Horns**: high-pass 100 to 200 Hz; cut 500 to 800 Hz if boxy and 1 to 5 kHz if harsh; shelf near 5 kHz.

  ## Voice

  - **Vocal and MC**: high-pass 80 to 150 Hz (one source says about 80 Hz for male and 140 Hz for female). Cut 200 to 500 Hz for mud and 500 Hz to 1.2 kHz for nasal tone; sibilance sits at 5 to 8 kHz (a de-esser is better than a deep notch). Boost 3 to 4 kHz broadly for presence and 1 to 1.5 kHz for intelligibility, about +3 dB.

  ## Where sources disagree

  Hi-hat high-pass ("lightly" versus 300 to 500 Hz), vocal high-pass (80 and 140 Hz versus 100 to 250 Hz) and kick high-pass (30 to 40 Hz versus 25 to 60 Hz). The table gives the wider window.

  ## Not covered by any source

  Genre-specific EQ tilt, playback tracks, a lectern mic and the snare-versus-vocal masking region have no direct source. Those rows are product heuristics.
body_vi: |
  ## Cách đọc bảng

  Các nguồn hiếm khi cho gain hay Q. Họ nêu một vùng và lý do ("boxy", "papery", "presence"). Khối rule ghi lại các vùng và bỏ số decibel trừ khi nguồn có cho. Nguyên tắc: cut các vùng hẹp nghe tệ, boost các vùng rộng nghe hay, và mọi thao tác đều làm bằng tai. Các khoảng dưới đây chỉ là điểm khởi đầu.

  ## Drums

  - **Kick**: high-pass khoảng 25 đến 60 Hz (35 Hz là điển hình). Cut 200 đến 500 Hz cho bớt boxy (nghe như bị bọng, bị nhốt trong một chiếc hộp); một chỗ lõm gần 180 Hz giúp bass ngồi vào. Boost 60 đến 90 Hz cho punch và 1 đến 5 kHz (khoảng 3 đến 4 kHz) cho beater click. Tránh boost sub dưới khoảng 40 Hz khi live.
  - **Snare**: high-pass 80 đến 200 Hz. Cut 400 đến 700 Hz cho bớt ring và 900 đến 1500 Hz nếu nghe papery. Boost 150 đến 250 Hz cho body (thân tiếng), 2 đến 3.5 kHz cho snap, một shelf gần 8 kHz cho crack. Vùng 2 đến 4 kHz tranh chỗ với presence của vocal.
  - **Toms**: high-pass khoảng 40 đến 100 Hz (con số chính xác chưa xác nhận). Cut gần 250 Hz cho bớt mud (đục, dày, các tiếng dính vào nhau); boost 60 đến 120 Hz cho body và 800 đến 1500 Hz cho attack.
  - **Hi-hat và ride**: high-pass 150 đến 500 Hz (hai nguồn bất đồng về mức mạnh tay). Cut 3 đến 7 kHz nếu harsh (chói, gắt); một shelf gần 10 đến 12 kHz thêm sheen.
  - **Overheads**: high-pass 150 đến 500 Hz, một cut rộng gần 4 kHz nếu harsh, một shelf ở 8 đến 12 kHz cho shimmer.

  ## Bass và guitars

  - **Bass**: high-pass khoảng 30 đến 45 Hz (khoảng này là quy ước của lane nghiên cứu, không phải số có nguồn). Cut 200 đến 400 Hz cho bớt mud; boost 220 đến 300 Hz cho character và 800 Hz đến 1 kHz cho articulation.
  - **Electric guitar**: high-pass 80 đến 120 Hz. Cut 200 đến 300 Hz cho bớt tubbiness (tiếng thùng) và 3 đến 6 kHz cho bớt fizz; một boost rộng gần 4 kHz thêm presence (một nguồn gợi ý +3 dB). Tuyệt đối không scoop mids khi live, phần lõi của guitar nằm ở 300 Hz đến 1.5 kHz.
  - **Acoustic guitar**: high-pass 60 đến 100 Hz. Cut 150 đến 400 Hz nếu bị tubby; boost gần 1.5 kHz cho presence và một shelf ở 8 đến 12 kHz cho air. Dễ feedback (hú rít) ở 100 đến 250 Hz, nên ưu tiên cut.

  ## Keys, strings, horns

  - **Keys**: cut 200 đến 500 Hz cho bớt mud và 2 đến 4 kHz để chừa chỗ cho vocal. High-pass (40 đến 100 Hz) không có nguồn.
  - **Strings**: high-pass 100 đến 150 Hz; cut 200 đến 500 Hz cho bớt mud và 1 đến 4 kHz cho bớt harshness; shelf gần 10 kHz cho air.
  - **Horns**: high-pass 100 đến 200 Hz; cut 500 đến 800 Hz nếu boxy và 1 đến 5 kHz nếu harsh; shelf gần 5 kHz.

  ## Voice

  - **Vocal và MC**: high-pass 80 đến 150 Hz (một nguồn nói khoảng 80 Hz cho giọng nam và 140 Hz cho giọng nữ). Cut 200 đến 500 Hz cho bớt mud và 500 Hz đến 1.2 kHz cho bớt nasal; sibilance (âm xuýt) nằm ở 5 đến 8 kHz, dùng de-esser tốt hơn là khoét notch sâu. Boost rộng 3 đến 4 kHz cho presence và 1 đến 1.5 kHz cho intelligibility, khoảng +3 dB.

  ## Chỗ các nguồn bất đồng

  High-pass của hi-hat ("nhẹ tay" so với 300 đến 500 Hz), high-pass của vocal (80 và 140 Hz so với 100 đến 250 Hz) và high-pass của kick (30 đến 40 Hz so với 25 đến 60 Hz). Bảng lấy cửa sổ rộng hơn.

  ## Không nguồn nào đề cập

  EQ tilt theo genre, playback track, mic lectern và vùng masking giữa snare và vocal đều không có nguồn trực tiếp. Các hàng đó là heuristic của sản phẩm.
