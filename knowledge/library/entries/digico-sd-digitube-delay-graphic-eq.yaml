summary: DiGiTube adds valve-style saturation per channel, channel delay is adjustable to sample precision, and the master section holds ganged 32-band graphic EQs used as inserts. Each has details the manual spells out.
summary_vi: DiGiTube thêm saturation kiểu đèn cho từng channel, channel delay chỉnh được tới độ chính xác sample, và master section chứa các graphic EQ 32 band có thể gang, dùng như insert. Mỗi cái có chi tiết mà manual nêu rõ.
body: |
  ## What the manual says (Issue H, V20+)

  - **DiGiTube** (Channel Setup display): emulates the non-linearity of a valve amplifier. Near linear at low levels, it compresses and soft-clips at high levels. The drive control raises the gain into the virtual valve and lowers the output gain to keep the volume constant; the indicator shows how hard it is driven. The bias control sets the symmetry: at 0, mostly even (2nd) harmonics; as bias rises it adds odd (3rd) harmonics, so low bias is softer and high bias is harder. The warmth button switches it on at default settings. The product page lists drive 0.01 to 50.0, bias 0 to 6 and 218 instances.
  - **Channel delay:** in the Channel Setup display, a coarse control in milliseconds and a fine control at sample precision. You can type a value; changing the unit in that keypad changes all instances of the value on the console. The product page says up to more than a second.
  - **Graphic EQ panel:** miniature views of all graphic EQs plus one expanded. Each has 32 band faders, an on button and a gain trim. The manual text gives the trim range as +/-12 dB in one paragraph and +/-18 dB in the next; the product page says +/-12 dB, which this entry uses as the safer value.
  - **Ganging:** GANG and Build Gang lock band faders, on buttons and trims together. Gang movement is relative, so EQs can keep different shapes. Stereo or surround channels with graphic EQs inserted are ganged automatically, and ungang when the insert is removed; it is the **Insert Return** routing, not the send, that gangs them. Hold the band's mute button while moving a fader to isolate that band. The ALL button moves a band on all graphic EQs.
  - Graphic EQs have their own SAFE and presets; Global Recall Scope and safes include them.

  ## How to use it on a show

  1. Use DiGiTube lightly for glue on bass, vocals or drums. Start with the warmth button, then raise drive; check the output level stays steady.
  2. Use channel delay to time-align spot mics or distributed speaker zones, with the fine control for sample-level alignment.
  3. Insert a graphic EQ on a bus or output for room or wedge ringing, and gang a stereo pair so both sides move together.
  4. Safe the graphic EQs on the Global scope if you do not want cues to change them.

  ## Pitfalls

  - Changing delay units changes the unit everywhere on the console.
  - DiGiTube adds harmonic content; high drive with high bias can sound hard.
  - A graphic EQ used as an insert needs the insert return routed correctly for stereo gang.

  ## What is NOT verified

  - The graphic-EQ gain range (see above).
  - "Graphic EQ on faders" as a surface feature: not covered in the pages read.
body_vi: |
  ## Manual nói gì (Issue H, V20+)

  - **DiGiTube** (màn hình Channel Setup): mô phỏng sự phi tuyến của amplifier đèn. Ở mức thấp gần tuyến tính, ở mức cao nó nén và soft-clip. Núm drive tăng gain vào con đèn ảo và tự giảm gain output để volume giữ nguyên; đồng hồ cho thấy nó đang bị đẩy mạnh cỡ nào. Núm bias đặt độ đối xứng: ở 0 chủ yếu là harmonic bậc chẵn (bậc 2); khi bias tăng thì thêm harmonic bậc lẻ (bậc 3), nên bias thấp mềm hơn và bias cao gắt hơn. Nút warmth bật nó ở setting mặc định. Trang sản phẩm ghi drive 0.01 đến 50.0, bias 0 đến 6 và 218 instance.
  - **Channel delay:** trong màn hình Channel Setup, một núm thô tính bằng ms và một núm tinh ở độ chính xác sample. Có thể gõ giá trị; đổi đơn vị trong keypad đó sẽ đổi mọi nơi dùng giá trị đó trên console. Trang sản phẩm nói tới hơn một giây.
  - **Graphic EQ panel:** hiển thị thu nhỏ mọi graphic EQ cộng một cái mở rộng. Mỗi cái có 32 fader band, nút on và gain trim. Chữ của manual ghi dải trim là +/-12 dB ở một đoạn và +/-18 dB ở đoạn kế; trang sản phẩm ghi +/-12 dB, mục này dùng số đó như giá trị an toàn hơn.
  - **Ganging:** GANG và Build Gang khoá các fader band, nút on và trim vào nhau. Gang di chuyển theo kiểu relative nên các EQ vẫn giữ hình dạng khác nhau. Channel stereo hoặc surround có graphic EQ insert thì tự gang, và tự ungang khi bỏ insert; chính routing **Insert Return**, không phải send, mới gang chúng. Giữ nút mute của band khi kéo fader để tách riêng band đó. Nút ALL kéo một band trên mọi graphic EQ.
  - Graphic EQ có SAFE và preset riêng; Global Recall Scope và safes có bao gồm chúng.

  ## Cách dùng trên show

  1. Dùng DiGiTube nhẹ để dính tiếng trên bass, vocal hoặc drums. Bắt đầu bằng nút warmth, rồi tăng drive; kiểm tra mức output giữ ổn.
  2. Dùng channel delay để căn thời gian cho spot mic hoặc các vùng loa phân tán, dùng núm tinh để căn ở mức sample.
  3. Insert graphic EQ lên bus hoặc output để xử lý ringing của phòng hoặc wedge, và gang cặp stereo để hai bên chạy cùng nhau.
  4. Safe graphic EQ ở Global scope nếu không muốn cue đổi chúng.

  ## Bẫy thường gặp

  - Đổi đơn vị delay là đổi đơn vị ở mọi nơi trên console.
  - DiGiTube thêm harmonic; drive cao cùng bias cao có thể nghe gắt.
  - Graphic EQ dùng như insert cần route insert return đúng thì gang stereo mới chạy.

  ## Điều CHƯA được xác minh

  - Dải gain của graphic EQ (xem trên).
  - "Graphic EQ trên fader" như một tính năng của surface: không có trong các trang đã đọc.
