summary: Hybrid shows run tracks or stems alongside live performers. The mixer's job is a reliable playback feed, a controlled low end through a proper sub system, and keeping live parts audible over dense backing.
summary_vi: Show hybrid chạy track hoặc stem cùng với người biểu diễn live. Việc của mixer là có một playback feed đáng tin cậy, low end được kiểm soát qua hệ thống sub đúng chuẩn, và giữ cho phần live vẫn nghe rõ trên nền backing dày.
body: |
  ## What is different

  Electronic and hybrid shows carry much of the sound on playback, so the FOH job shifts from balancing instruments to managing sources: how the tracks arrive, how loud they are against live parts, and how much low end reaches the room. Sourcing here is thin. The best sources I could open are two general Sound On Sound pieces on playback and live bass, so this entry sticks to what they support and gives no EDM-specific numbers.

  ## Playback

  Paul White describes a band that feeds backing material from CD to the PA in stereo, with live effects on the backing parts, and records that laptops had crashed in his experience, which is why he used CDs. He also reports a Mac laptop feeding the PA cleanly on battery but buzzing on mains power. Both points still apply to modern rigs: treat the playback source as a risk, test it with the PA on and the charger connected, and have a backup. Keep playback on its own stereo channels so you can ride it against live parts and apply a high-pass or EQ without touching the live mic.

  ## Low end and subwoofers

  Electronic drum parts carry heavy low-frequency energy, so low-end power and headroom matter (White). Feed the sub from a proper system with a crossover, not from an aux send: the aux approach leaves the main speakers carrying bass they should not. Use high-pass filters on channels that do not need low end so the sub is not overloaded (White; Burton). Sub position is less critical than for monitors, and a wall or corner can add output.

  Jon Burton quotes engineers noting that artists often do not want a lot of sub rattling the stage, so check what the performers need on stage before you push the system.

  ## Balancing live against tracks

  A live vocal over dense tracks needs the same fix as in pop: bright playback can mask it, so high-shelf or otherwise EQ the track and give the live voice its own space. See the live pop entry. Walk the room: Burton notes the mix position, often near a back wall in small venues, can mislead you about bass.

  ## Effects

  Effects are usually baked into the tracks; add delay or reverb to the live parts only, and keep returns high-passed so they do not add sub-level energy.

  ## Common mistakes

  - Trusting a laptop feed without a backup path.
  - Letting sub-bass tracks and a live bass double each other.
  - Boosting deep bass to impress and overloading the PA.

  I found no reputable source that gives a crossover frequency, sub level or loudness target for EDM live shows, so none is given. Measure with a real analyser in the room.
body_vi: |
  ## Khác biệt ở đâu

  Các show electronic và hybrid dồn nhiều âm thanh vào playback, nên việc của FOH chuyển từ cân bằng nhạc cụ sang quản lý nguồn: track đến bằng đường nào, to cỡ nào so với phần live, và bao nhiêu low end được đưa vào phòng. Nguồn tham khảo ở đây khá mỏng. Những nguồn tốt nhất tôi mở được là hai bài tổng quát của Sound On Sound về playback và bass live, nên mục này chỉ bám vào những gì chúng hỗ trợ và không đưa con số riêng cho EDM.

  ## Playback

  Paul White mô tả một band đưa backing từ CD vào PA ở dạng stereo, với effect live trên các phần backing, và ghi lại rằng theo kinh nghiệm của ông laptop từng bị crash, vì thế ông dùng CD. Ông cũng báo cáo một laptop Mac đưa vào PA sạch khi chạy pin nhưng bị buzz khi cắm điện lưới. Cả hai điểm này vẫn đúng với các rig hiện đại: coi nguồn playback là một rủi ro, test khi PA đang bật và sạc đã cắm, và luôn có phương án dự phòng. Giữ playback trên các stereo channel riêng để bạn ride nó so với phần live và áp dụng high-pass hoặc EQ mà không chạm vào mic live.

  ## Low end và subwoofer

  Các phần trống điện tử mang nhiều năng lượng tần số thấp, nên công suất low end và Headroom rất quan trọng (White). Cấp tín hiệu cho sub từ một hệ thống đúng nghĩa có crossover, không phải từ một aux send: cách dùng aux khiến loa main phải gánh bass mà chúng không nên gánh. Dùng high-pass filter trên các channel không cần low end để sub không bị quá tải (White; Burton). Vị trí đặt sub ít quan trọng hơn so với monitor, và một bức tường hay góc phòng có thể tăng thêm output.

  Jon Burton trích dẫn các kỹ sư lưu ý rằng nghệ sĩ thường không muốn sub làm rung cả sân khấu, nên hãy kiểm tra họ cần gì trên stage trước khi đẩy hệ thống.

  ## Cân bằng live với track

  Vocal live đè lên track dày cần cách xử lý giống như pop: playback bright (sáng) có thể che lấp vocal (masking), nên hãy high-shelf hoặc EQ track và cho giọng live chỗ riêng. Xem mục live pop. Hãy đi quanh phòng nghe: Burton lưu ý vị trí mix, thường sát tường sau ở các venue nhỏ, có thể đánh lừa bạn về bass.

  ## Effect

  Effect thường đã nằm sẵn trong track; chỉ thêm delay hoặc reverb cho phần live, và giữ các return được high-pass để chúng không thêm năng lượng ở mức sub.

  ## Lỗi thường gặp

  - Tin vào feed laptop mà không có đường dự phòng.
  - Để track sub-bass và bass live chồng lên nhau.
  - Boost bass sâu để gây ấn tượng rồi làm PA quá tải.

  Tôi không tìm thấy nguồn đáng tin nào cho tần số crossover, mức sub hay mục tiêu loudness cho show EDM live, nên không đưa ra. Hãy đo bằng analyser thật ngay trong phòng.
