summary: Close mics inside an acoustic piano for gain before feedback; DI for stage pianos and synths; keep the low end of keys from stacking with bass and kick.
summary_vi: Đặt mic gần bên trong đàn piano acoustic để có gain before feedback; dùng DI cho stage piano và synth; đừng để low end của keys chồng lên bass và kick.
body: |
  ## Acoustic piano

  A distant mic is not practical for reinforcement because of gain-before-feedback limits, so the standard is to place the microphone close to or inside the piano. Condensers are generally preferred because they hold the full range; Shure lists the Beta 181, KSM137 and PGA81 among suitable models.

  - **Over the treble strings:** brighter. **Over the bass strings:** more low end.
  - **Near the hammers:** sharper attack. **Farther away:** softer, blended sound.
  - **Two mics, one over treble and one over bass,** is a common starting point; it gives balance and mix control and can be panned for width.
  - **Boundary mic under the lid:** improves isolation and reduces feedback; a Beta 181 can be mounted horizontally so the lid can close. Partly or fully closing the lid also cuts spill.
  - Compact clip mics (DPA 4099 type) save stand space on a crowded stage.

  ## Stage piano and synths

  A stage piano or synth outputs a line-level signal, so use a DI box (or direct line input) and skip the amp and mic unless the keyboardist insists on an amp sound. This is general practice rather than something taken from the cited pages. Two mono DI channels, panned left and right, keep stereo patches stereo; one summed channel keeps it mono for small rooms.

  ## Starting EQ

  iZotope's starting regions for piano:

  - 20-60 Hz: sub energy, usually unnecessary live; high-pass around 40-80 Hz in a full band.
  - 60-200 Hz: body; trim if it crowds bass and kick.
  - 200-500 Hz: possible mud.
  - 2-4 kHz: possible harshness.

  Pads and strings patches usually crowd 200-500 Hz; a gentle shelf cut there makes room for vocals and guitars.

  ## Dynamics

  Piano ranges across more than seven octaves (about 27 Hz to 4.2 kHz fundamentals), so a single compressor reacts to bass notes first. Use light compression only if the player's dynamics are extreme, and prefer riding the fader.

  ## Common problems

  - **Piano boom or feedback near the monitor:** move the mic closer to the strings, off the soundboard, or use a boundary mic.
  - **Wide piano collapses in mono PA:** check polarity between the two mics.
  - **Synth patch level jumps:** ask the player to run the loudest patches at soundcheck.

  ## Live and WING tips

  Use one static EQ band to tame harshness on bright patches rather than reaching for dynamics. Keep the keyboard DI out of the monitor wedge's direct path to avoid ringing.
body_vi: |
  ## Piano acoustic

  Mic đặt xa không khả thi khi khuếch đại do giới hạn gain before feedback, nên chuẩn là đặt mic gần hoặc bên trong đàn. Condenser thường được ưu tiên vì giữ được toàn dải; Shure liệt kê Beta 181, KSM137 và PGA81 trong các model phù hợp.

  - **Trên dây treble:** bright hơn. **Trên dây bass:** nhiều low end hơn.
  - **Gần búa (hammer):** Attack sharper. **Xa hơn:** tiếng mềm, hòa vào nhau.
  - **Hai mic, một trên treble và một trên bass,** là điểm xuất phát phổ biến; cho balance và khả năng kiểm soát mix, và có thể pan để mở rộng.
  - **Boundary mic dưới nắp đàn:** tăng độ cách ly và giảm feedback; Beta 181 có thể gắn nằm ngang để nắp vẫn đóng được. Khép một phần hoặc đóng hẳn nắp cũng giảm spill.
  - Mic kẹp nhỏ gọn (loại DPA 4099) tiết kiệm chỗ chân mic trên sân khấu đông.

  ## Stage piano và synth

  Stage piano hoặc synth xuất tín hiệu line-level, nên dùng DI box (hoặc line input trực tiếp) và bỏ amp với mic, trừ khi người chơi keys nhất quyết muốn tiếng amp. Đây là thực hành chung chứ không lấy từ các trang được trích dẫn. Hai kênh DI mono, pan trái và phải, giữ patch stereo vẫn stereo; một kênh đã cộng lại (summed) giữ mono cho phòng nhỏ.

  ## EQ xuất phát

  Các vùng xuất phát của iZotope cho piano:

  - 20-60 Hz: năng lượng sub, live thường không cần; high-pass quanh 40-80 Hz khi có full band.
  - 60-200 Hz: body; cắt bớt nếu nó chen với bass và kick.
  - 200-500 Hz: có thể bị mud (đục, dày, các tiếng dính vào nhau).
  - 2-4 kHz: có thể harsh (chói gắt).

  Patch pad và strings thường chen ở 200-500 Hz; một shelf cắt nhẹ ở đó chừa chỗ cho vocal và guitar.

  ## Dynamics

  Piano trải trên bảy octave (fundamental khoảng 27 Hz đến 4.2 kHz), nên một compressor duy nhất sẽ phản ứng với nốt bass trước. Chỉ dùng compression nhẹ nếu dynamics của người chơi quá cực đoan, và ưu tiên ride fader.

  ## Vấn đề thường gặp

  - **Piano boom hoặc feedback gần monitor:** đưa mic lại gần dây hơn, rời khỏi soundboard, hoặc dùng boundary mic.
  - **Piano rộng bị sập trong PA mono:** kiểm tra polarity giữa hai mic.
  - **Level patch synth nhảy:** nhờ người chơi chạy các patch to nhất ở soundcheck.

  ## Mẹo live và WING

  Dùng một band EQ tĩnh để dằn harshness ở các patch bright thay vì dùng tới dynamics. Giữ DI của keyboard ra khỏi đường trực tiếp của monitor wedge để tránh ringing.
