# Diagram manifest, rendered by scripts/library_diagrams.py into
# media/<entry>/<file>.svg + .png. The entry references the PNG with a
# media item {kind: diagram, path: <file>.png, caption, license: CC0-1.0,
# attribution: "Generated for wing-parser", generated_by: scripts/library_diagrams.py}.
#
# Kinds and their keys (all frequencies Hz, levels dB, times ms):
#   eq_curve:       curves: [{label, filters: [{type: hpf|lpf|low_shelf|high_shelf|bell|notch,
#                    f, gain_db?, q?, slope?}]}], y_range: [lo, hi]   (slope: 6|12|18|24|48 dB/oct)
#   band_chart:     bands: [{label, lo, hi}]  (horizontal bars on a 20 Hz-20 kHz log axis)
#   transfer_curve: curves: [{label, mode: compress|expand|gate|limit, threshold_db, ratio?,
#                    knee_db?, range_db?}]  (input dB vs output dB, -60..0)
#   envelope:       attack_ms, release_ms, hold_ms?, threshold_db?, ratio?  (input burst vs gain reduction over time)
#   polar_pattern:  patterns: [omni|subcardioid|cardioid|supercardioid|hypercardioid|figure8]
#   signal_flow:    nodes: [{label, note?}]  (left-to-right chain with arrows)
#   range_chart:    x_label, unit?, x_range?: [lo, hi], rows: [{label, lo, hi}]  (horizontal bars on a linear axis)
#   xy_plot:        x_label, y_label, x_log?, series: [{label, points: [[x, y], ...]}]
#   ui_steps:       panel?, regions: [{id, label, x, y, w, h (percent of the panel box, 0-100),
#                    style: button|display|fader|knob|grid, lit? (button), lines? (display),
#                    count? (fader), rows/cols/cells (grid; cell: tick|x|blank)}],
#                    steps: [{n, region, text}]  (1-6 steps; schematic console panel with numbered
#                    callouts; n must match the entry body's step numbers)
diagrams:
  - entry: eq-filter-types
    file: hpf-slopes
    kind: eq_curve
    title: "High-pass filter at 100 Hz, four slopes"
    y_range: [-36, 6]
    curves:
      - {label: "6 dB/oct", filters: [{type: hpf, f: 100, slope: 6}]}
      - {label: "12 dB/oct", filters: [{type: hpf, f: 100, slope: 12}]}
      - {label: "18 dB/oct", filters: [{type: hpf, f: 100, slope: 18}]}
      - {label: "24 dB/oct", filters: [{type: hpf, f: 100, slope: 24}]}
  - entry: eq-filter-types
    file: bell-q-compare
    kind: eq_curve
    title: "+6 dB bell at 1 kHz: Q 0.7, 1.4, 4"
    y_range: [-3, 9]
    curves:
      - {label: "Q 0.7", filters: [{type: bell, f: 1000, gain_db: 6, q: 0.7}]}
      - {label: "Q 1.4", filters: [{type: bell, f: 1000, gain_db: 6, q: 1.4}]}
      - {label: "Q 4", filters: [{type: bell, f: 1000, gain_db: 6, q: 4}]}
  - entry: eq-filter-types
    file: shelves
    kind: eq_curve
    title: "Low shelf -6 dB at 200 Hz, high shelf +4 dB at 8 kHz"
    y_range: [-9, 9]
    curves:
      - {label: "low shelf", filters: [{type: low_shelf, f: 200, gain_db: -6, q: 0.7}]}
      - {label: "high shelf", filters: [{type: high_shelf, f: 8000, gain_db: 4, q: 0.7}]}
  - entry: comp-threshold-ratio-knee
    file: transfer-ratios
    kind: transfer_curve
    title: "Compressor transfer curve, threshold -20 dB"
    curves:
      - {label: "1:1", mode: compress, threshold_db: -20, ratio: 1}
      - {label: "2:1", mode: compress, threshold_db: -20, ratio: 2}
      - {label: "4:1", mode: compress, threshold_db: -20, ratio: 4}
      - {label: "10:1 soft knee 10 dB", mode: compress, threshold_db: -20, ratio: 10, knee_db: 10}
  - entry: mic-polar-patterns
    file: polar-patterns
    kind: polar_pattern
    title: "First-order polar patterns"
    patterns: [omni, cardioid, supercardioid, hypercardioid, figure8]
  - entry: automix-gain-sharing-dugan
    file: gain-sharing-flow
    kind: signal_flow
    title: "Gain-sharing automixer, signal path"
    nodes:
      - {label: "Mic inputs", note: "all stay open"}
      - {label: "Level detectors", note: "one per channel"}
      - {label: "Compare with group level", note: "dB difference per channel"}
      - {label: "Per-channel gain", note: "total gain stays constant"}
      - {label: "Mix output"}
  - entry: automix-gated-and-nom
    file: nom-attenuation
    kind: xy_plot
    title: "NOM attenuation = 10*log10(NOM)"
    x_log: true
    x_label: "Number of open mics (NOM)"
    y_label: "Group attenuation (dB)"
    series:
      - label: "10*log10(NOM)"
        points: [[1, 0], [2, 3.01], [3, 4.77], [4, 6.02], [6, 7.78], [8, 9.03], [12, 10.79], [16, 12.04]]
  - entry: intelligent-mixing-research
    file: cross-adaptive-flow
    kind: signal_flow
    title: "Cross-adaptive processing (after De Man et al. 2017; Ma et al. 2015)"
    nodes:
      - {label: "Per-channel feature extraction", note: "loudness, spectrum, crest factor"}
      - {label: "Shared cross-adaptive rules", note: "sees every channel"}
      - {label: "Per-channel control values", note: "gain, pan, EQ, compressor"}
      - {label: "Channel processors"}
      - {label: "Summed mix"}
  - entry: automatic-fader-balance-loudness
    file: loudness-balance-flow
    kind: signal_flow
    title: "Loudness-based balancing, with the engineer in the loop"
    nodes:
      - {label: "Measure channel loudness", note: "energy or loudness model"}
      - {label: "Compare with target", note: "per-instrument template"}
      - {label: "Suggest gain offsets"}
      - {label: "Engineer adjusts by ear", note: "vocals/speech on top"}
  - entry: automatic-eq-and-compression-research
    file: auto-compression-flow
    kind: signal_flow
    title: "Cross-adaptive compression (after Ma et al. 2015, Fig. 7)"
    nodes:
      - {label: "Feature extraction", note: "RMS, crest factor, low-freq weighting"}
      - {label: "Cross-adaptive analysis", note: "all tracks"}
      - {label: "Compressor parameters", note: "threshold, ratio, knee, attack, release"}
      - {label: "Loudness make-up gain"}
      - {label: "Stereo sum"}
  - entry: wing-channel-processing-chain
    file: wing-channel-flow
    kind: signal_flow
    title: "WING channel blocks as listed on the HOME screen"
    nodes:
      - {label: "Input", note: "post delay in input section"}
      - {label: "Gate"}
      - {label: "EQ"}
      - {label: "Dynamics"}
      - {label: "Pre-fader insert", note: "position movable"}
      - {label: "Fader / Main"}
      - {label: "Post-fader insert", note: "fixed"}
      - {label: "Bus sends", note: "tap point selectable"}
  - entry: wing-automix
    file: wing-automix-position
    kind: signal_flow
    title: "Automix position in a WING channel"
    nodes:
      - {label: "Channel processing", note: "gate, EQ, dynamics"}
      - {label: "Fader"}
      - {label: "Post-fader insert slot", note: "automix group A or B"}
      - {label: "Main / bus"}
  - entry: soundcheck-workflow
    file: soundcheck-steps
    kind: signal_flow
    title: "Soundcheck in layers"
    nodes:
      - {label: "Power and patch"}
      - {label: "Line check", note: "each input at show level; set gain"}
      - {label: "Soundcheck", note: "30-60 s excerpts, band together"}
      - {label: "Readiness pass", note: "about 60 s, first song"}
  - entry: comp-attack-release
    file: attack-release-envelope
    kind: envelope
    title: "Gain reduction over time: attack 10 ms, release 150 ms"
    attack_ms: 10
    release_ms: 150
    threshold_db: -20
    ratio: 4
  - entry: gate-and-expander
    file: gate-expander-curves
    kind: transfer_curve
    title: "Gate versus expander, threshold -40 dB"
    curves:
      - {label: "gate, range -40 dB", mode: gate, threshold_db: -40, range_db: -40}
      - {label: "gate, range -15 dB", mode: gate, threshold_db: -40, range_db: -15}
      - {label: "expander 2:1", mode: expand, threshold_db: -40, ratio: 2}
  - entry: de-esser
    file: sibilance-bands
    kind: band_chart
    title: "Sibilance region against the voice (starting windows)"
    bands:
      - {label: "voice body", lo: 100, hi: 1000}
      - {label: "presence", lo: 2000, hi: 5000}
      - {label: "sibilance (typical)", lo: 4000, hi: 10000}
  - entry: fx-reverb-types-and-parameters
