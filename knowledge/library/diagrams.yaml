  # --- avid-s6l (console section, 2026-11-10)
  - entry: avid-s6l-system-architecture
    file: s6l-system-chain
    kind: signal_flow
    title: S6L system chain over AVB (simplified)
    nodes:
    - label: Stage I/O racks
      note: 'Stage 64 / 48 / 32 / 16: mic preamps, A/D'
    - label: AVB network
      note: copper or fibre, 96 kHz
    - label: E6L / E6LX engine
      note: all channel processing + HDX DSP plug-ins
    - label: S6L control surface
      note: faders, CKM encoders, touch screens
  - entry: avid-s6l-snapshots
    file: snapshot-recall-flow
    kind: signal_flow
    title: What a snapshot recall actually changes
    nodes:
    - label: Snapshot stores everything
      note: all data types, all channels
    - label: Scope
      note: data types x channels chosen per snapshot
    - label: Recall Safe
      note: global veto, applies to all snapshots
    - label: Live mix updates
      note: only what passed both filters
  - entry: avid-s6l-scope-recall-safe
    file: scope-filter-layers
    kind: signal_flow
    title: Filters between a snapshot and the live mix
    nodes:
    - label: Data Type scope
      note: Fader, Mute, EQ, Dyn, Pre, ...
    - label: Channel scope
      note: red faders on Snapshots page
    - label: User Aux Scope
      note: individual Aux per input
    - label: Recall Safe matrix
      note: parameter x channel, global
    - label: Automation Safe
      note: whole channel ignores snapshots
  - entry: avid-s6l-events
    file: event-anatomy
    kind: signal_flow
    title: Anatomy of an S6L Event
    nodes:
    - label: Triggers
      note: switch, fader, meter, snapshot, MIDI, GPI
    - label: Logic operator
      note: AND / OR / XOR, one per event
    - label: Actions
      note: mute, snapshot, GPI out, Pro Tools, talkback
    - label: Behavior + Wait
      note: Latch or While Active; Wait up to 100 s
  - entry: avid-s6l-spill-layouts
    file: spill-workflow
    kind: signal_flow
    title: Spill an Aux, Group, Matrix or VCA to the faders
    nodes:
    - label: Double-tap the Attention key
      note: of the output master
    - label: Members spill to faders
      note: no bank navigation needed
    - label: Mix the members
      note: levels, sends, mutes
    - label: Unspill
      note: Attention again, Cancel, or Exit Spill
  - entry: avid-s6l-select-attention
    file: select-vs-attention
    kind: signal_flow
    title: Select versus Attention
    nodes:
    - label: Select switch
      note: targets the local CKM encoders
    - label: Attention switch
      note: targets MTS and external screen
    - label: Attention Follows Select
      note: on by default; can be decoupled
  - entry: avid-s6l-plugin-racks
    file: plugin-rack-path
    kind: signal_flow
    title: AAX plug-in path through the E6L rack
    nodes:
    - label: Channel insert or bus
      note: 4 inserts per channel
    - label: Rack slot
      note: 400 slots, 5 racks of 80
    - label: HDX DSP card
      note: 18 DSPs per card
    - label: Back to channel or bus
      note: plug-in latency + routing delay
  - entry: avid-s6l-delay-compensation
    file: adc-modes
    kind: signal_flow
    title: Automatic Delay Compensation (ADC)
    nodes:
    - label: Plug-in latency
      note: reported by each plug-in
    - label: Routing delay
      note: 101 samples to and from the racks
    - label: ADC setting
      note: Off / Mix Only / Mix & Inserts
    - label: Paths aligned
      note: at Mains and Matrix outputs
  - entry: avid-s6l-virtual-soundcheck
    file: virtual-soundcheck-path
    kind: signal_flow
    title: Virtual Soundcheck with Pro Tools
    nodes:
    - label: Stage inputs
      note: split post analog gain, pre digital trim
    - label: AVB or MADI to Pro Tools
      note: record up to 128 tracks over AVB
    - label: Input source = Pro Tools
      note: playback replaces Stage inputs
    - label: Mix on the console
      note: changes carry back to Stage mode
  - entry: avid-s6l-io-sharing
    file: io-sharing-roles
    kind: signal_flow
    title: 'Shared Stage rack: Input Master and Follower'
    nodes:
