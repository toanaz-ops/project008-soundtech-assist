      - label: "copy at -1 dB"
        points: [[0, 5.6], [50, 5.5], [100, 5.1], [150, 4.6], [200, 3.7], [250, 2.6], [300, 1.0], [350, -1.2], [400, -4.5], [450, -10.1], [500, -20.0], [550, -10.1], [600, -4.5], [650, -1.2], [700, 1.0], [750, 2.6], [800, 3.7], [850, 4.6], [900, 5.1], [950, 5.5], [1000, 5.6], [1050, 5.5], [1100, 5.1], [1150, 4.6], [1200, 3.7], [1250, 2.6], [1300, 1.0], [1350, -1.2], [1400, -4.5], [1450, -10.1], [1500, -20.0], [1550, -10.1], [1600, -4.5], [1650, -1.2], [1700, 1.0], [1750, 2.6], [1800, 3.7], [1850, 4.6], [1900, 5.1], [1950, 5.5], [2000, 5.6], [2050, 5.5], [2100, 5.1], [2150, 4.6], [2200, 3.7], [2250, 2.6], [2300, 1.0], [2350, -1.2], [2400, -4.5], [2450, -10.1], [2500, -20.0], [2550, -10.1], [2600, -4.5], [2650, -1.2], [2700, 1.0], [2750, 2.6], [2800, 3.7], [2850, 4.6], [2900, 5.1], [2950, 5.5], [3000, 5.6]]
